name: Recuperar foto de producto
on:
  workflow_dispatch:
    inputs:
      foto: { description: "URL de la foto", required: true }
  push:
    paths: [".github/verificacion/foto-producto.mjs", ".github/workflows/foto-producto.yml"]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/verificacion/foto-producto.mjs
        env: { FOTO: "${{ github.event.inputs.foto || 'https://ik.imagekit.io/agxhbnabg/consignacion/ANP013T7_XUKP_ob5VJ.jpg' }}" }
      - name: Guardar en la rama
        run: |
          mkdir -p .github/fotos-recuperadas && cp salida/*.jpg .github/fotos-recuperadas/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add .github/fotos-recuperadas && git commit -m "Foto recuperada [skip ci]" && git push || echo "nada que guardar"

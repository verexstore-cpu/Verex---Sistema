name: Recuperar foto de producto
on:
  workflow_dispatch:
    inputs:
      foto: { description: "URL de la foto", required: true }
  push:
    paths: [".github/verificacion/foto-producto.mjs", ".github/workflows/foto-producto.yml"]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/verificacion/foto-producto.mjs
        env: { FOTO: "${{ github.event.inputs.foto || 'https://ik.imagekit.io/agxhbnabg/consignacion/ANP013T7_XUKP_ob5VJ.jpg' }}" }
      - name: Reducir a 2000 px y guardar en la rama
        run: |
          ls -la salida
          if [ -f salida/original.jpg ]; then identify salida/original.jpg || true; convert salida/original.jpg -resize '2000x2000>' -quality 88 salida/ANP013-2000px.jpg; identify salida/ANP013-2000px.jpg; fi
          mkdir -p .github/fotos-recuperadas && cp salida/*.jpg .github/fotos-recuperadas/ 2>/dev/null || true
          rm -f .github/fotos-recuperadas/original.jpg
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add .github/fotos-recuperadas && git commit -m "Foto recuperada ANP013 [skip ci]" && git push || echo "nada que guardar"

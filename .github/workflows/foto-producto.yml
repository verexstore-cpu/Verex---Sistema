name: Recuperar foto de producto
on:
  workflow_dispatch:
    inputs:
      fotos: { description: "NOMBRE=url separados por coma", required: true }
  push:
    paths: [".github/verificacion/foto-producto.mjs", ".github/workflows/foto-producto.yml"]
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/verificacion/foto-producto.mjs
        env: { FOTOS: "${{ github.event.inputs.fotos || 'ANP060=https://ik.imagekit.io/agxhbnabg/consignacion/ANP060CT10_VGt06ypex.png,ANP240=https://ik.imagekit.io/agxhbnabg/consignacion/ANP240CT10_xq6VGlh-eT.png' }}" }
      - name: Guardar en la rama
        run: |
          mkdir -p .github/fotos-recuperadas && cp salida/* .github/fotos-recuperadas/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add .github/fotos-recuperadas && git commit -m "Foto recuperada [skip ci]" && git push || echo "nada que guardar"

    // Habilita el botón de confirmar solo cuando ya hay talla(s) elegida(s)
    // Y, si el catálogo es de afiliado Y se va a enviar YA por WhatsApp, el
    // teléfono tiene algo escrito (en modo carrito el teléfono se pide luego,
    // una sola vez, al enviar todo el pedido junto).
    function actualizarBotonSz(){
        const tallaLista = _szNoTalla ? true : (_szParMode ? (_szD && _szH) : !!_szD);
        const telInput = document.getElementById("sz-tel");
        const nombreInput = document.getElementById("sz-nombre");
        const direccionInput = document.getElementById("sz-direccion");
        // Nombre, teléfono y dirección se exigen siempre que se vaya a mandar
        // YA por WhatsApp (cliente o afiliado) — en modo carrito no aplica
        // aquí, se piden una sola vez al final en el cajón del carrito.
        const requiereDatos = _szModo === "wa";
        const telOk = requiereDatos ? !!(telInput && telInput.value.trim().length >= 4) : true;
        const nombreOk = requiereDatos ? !!(nombreInput && nombreInput.value.trim().length >= 2) : true;
        const direccionOk = requiereDatos ? !!(direccionInput && direccionInput.value.trim().length >= 8) : true;
        _szTel = telInput ? telInput.value.trim() : "";
        _szNombreCliente = nombreInput ? nombreInput.value.trim() : "";
        _szDireccion = direccionInput ? direccionInput.value.trim() : "";
        const listo = tallaLista && telOk && nombreOk && direccionOk;
        const btn = document.getElementById("sz-confirm");
        btn.disabled = !listo;
        btn.style.opacity = listo ? "1" : ".5";
        btn.textContent = t('agregarCarrito');
    }

    // Arma un texto corto de talla y el precio unitario ya con descuento
    // aplicado, reutilizando el mismo estado (p, _szD/_szH/_szParMode/
    // _szNoTalla) que ya calcula confirmarTalla() para el mensaje directo.
    function _labelYPrecioCarrito(p){
        if(_szParMode && _szNoTalla){
            const precio = (p.pD && p.pH) ? precioFinal(parseFloat(p.pD)) + precioFinal(parseFloat(p.pH)) : precioFinal(p.p);
            return { label: t('tallasParConfirmar'), precio };
        }
        if(_szNoTalla){
            return { label: "", precio: precioFinal(p.p) };
        }
        if(_szParMode){
            const precio = (p.pD != null && p.pH != null) ? precioFinal(parseFloat(p.pD) + parseFloat(p.pH)) : precioFinal(p.p);
            const partes = [
                _szD && _szD !== "N/A" ? `${t('damaLbl')} T${_szD}` : '',
                _szH && _szH !== "N/A" ? `${t('caballeroLbl')} T${_szH}` : ''
            ].filter(Boolean);
            return { label: partes.join(" / "), precio };
        }
        return { label: `${t('tallaCorta')} T${_szD}`, precio: precioFinal(p.p) };
    }

    function confirmarTalla(){
        const p = _prods[_szIdx];

        if(_szModo === "carrito"){
            const { label, precio } = _labelYPrecioCarrito(p);
            agregarACarrito(p, label, precio);
            cerrarTallas();
            miniToast("✅ Agregado al carrito");
            return;
        }

        let msg;
        const telLinea = (_szNombreCliente || _szTel || _szDireccion)
            ? `\n\nMis datos:${_szNombreCliente?`\nNombre: ${_szNombreCliente}`:''}${_szTel?`\nWhatsApp: ${_szTel}`:''}${_szDireccion?`\nDirección de envío: ${_szDireccion}`:''}`
            : '';

        if(_szParMode && _szNoTalla){
            const precioInfo = (p.pD && p.pH && p.pD !== p.pH)
                ? `Precio dama: $${precioFinal(p.pD).toFixed(2)} por pieza\nPrecio caballero: $${precioFinal(p.pH).toFixed(2)} por pieza`
                : `Precio individual: $${precioFinal(p.p).toFixed(2)} por pieza`;
            const sizesInfo = [
                p.sizesD?.length ? `Dama: ${p.sizesD.map(s=>'T'+s).join(', ')}` : '',
                p.sizesH?.length ? `Caballero: ${p.sizesH.map(s=>'T'+s).join(', ')}` : ''
            ].filter(Boolean).join('\n');
            msg = `Hola, me interesan estas argollas del catálogo VEREX:\n\n${p.n}\n${precioInfo}${sizesInfo ? `\n\nTallas disponibles:\n${sizesInfo}` : ''}\n\n¿Qué tallas necesita para dama y caballero?${telLinea}`;
        } else if(_szNoTalla){
            msg = `Hola, me interesa este producto del catálogo VEREX:\n\n${p.n}\nPrecio: $${precioFinal(p.p).toFixed(2)}${telLinea}`;
        } else if(_szParMode){
            const precioInfo = (p.pD != null && p.pH != null)
                ? `Precio total: $${precioFinal(parseFloat(p.pD)+parseFloat(p.pH)).toFixed(2)}`
                : `Precio: $${precioFinal(p.p).toFixed(2)}`;
            const tallasInfo = [
                _szD && _szD !== "N/A" ? `Talla dama: T${_szD}` : '',
                _szH && _szH !== "N/A" ? `Talla caballero: T${_szH}` : ''
            ].filter(Boolean).join('\n');
            msg = `Hola, me interesa este producto del catálogo VEREX:\n\n${p.n}\n${precioInfo}\n${tallasInfo}${telLinea}`;
        } else {
            msg = `Hola, me interesa este producto del catálogo VEREX:\n\n${p.n}\nPrecio: $${precioFinal(p.p).toFixed(2)}\nTalla: T${_szD}${telLinea}`;
        }
        registrarLead(p, { telefono: _szTel, nombreCliente: _szNombreCliente, direccionCliente: _szDireccion });
        cerrarTallas();
        window.open(`https://wa.me/${_waNum}?text=${encodeURIComponent(msg)}`,"_blank");
    }

    function cerrarTallas(){
        document.getElementById("sz-overlay").classList.remove("open");
    }

    /* ── Carrito multi-producto ── */
    // Discreto a propósito: no cambia el flujo de "¡Hazlo tuyo!" (que sigue
    // mandando un WhatsApp inmediato), solo agrega una alternativa para
    // juntar varios productos y mandarlos en un solo mensaje al final.

    // Regalo del banner promo: al tocarlo (o solo, un segundo después de
    // cargar la página) deja de bambolear, se agranda, y lanza confeti de
    // colores dorados desde su posición — puramente decorativo, se puede
    // volver a tocar para repetir.
    function _abrirRegaloPromo(el){
        if(!el) return;
        el.classList.add("abierto");
        el.textContent = "🎉";
        setTimeout(() => { el.classList.remove("abierto"); el.textContent = "🎁"; }, 700);

        const contenedor = el.closest("div[style*='position:relative']") || el.parentElement;
        const colores = ["#C9A84C","#fff3c4","#8a6a1f","#fff","#e8c766"];
        for(let i=0;i<22;i++){
            const bit = document.createElement("span");
            bit.className = "confetti-bit";
            bit.style.background = colores[i % colores.length];
            bit.style.left = (45 + Math.random()*10) + "%";
            bit.style.transform = `translateX(${(Math.random()-0.5)*140}px)`;
            bit.style.animationDelay = (Math.random()*120) + "ms";
            bit.style.animationDuration = (700 + Math.random()*400) + "ms";
            contenedor.appendChild(bit);
            setTimeout(() => bit.remove(), 1300);
        }
    }

    // Lluvia de confeti a pantalla completa — anuncia la promo UNA sola vez
    // al cargar la página, cayendo desde arriba de todo el viewport (no solo
    // cerca del ícono). Se dispara aparte de _abrirRegaloPromo, que sigue
    // siendo el efecto chico y repetible al tocar el regalo.
    function _lluviaConfettiPromo(){
        const wrap = document.createElement("div");
        wrap.id = "confetti-rain-wrap";
        document.body.appendChild(wrap);
        const colores = ["#C9A84C","#fff3c4","#8a6a1f","#fff","#e8c766","#7c3aed"];
        const formas = ["50%", "2px"]; // algunas redondas, algunas cuadradas
        for(let i=0;i<70;i++){
            const bit = document.createElement("span");
            bit.className = "confetti-rain-bit";
            const w = 6 + Math.random()*5;
            bit.style.width = w + "px";
            bit.style.height = (w*1.5) + "px";
            bit.style.borderRadius = formas[i % 2];
            bit.style.background = colores[i % colores.length];
            bit.style.left = Math.random()*100 + "vw";
            bit.style.animationDuration = (1800 + Math.random()*1400) + "ms";
            bit.style.animationDelay = (Math.random()*900) + "ms";
            wrap.appendChild(bit);
        }
        setTimeout(() => wrap.remove(), 3500);
    }

    function guardarCarrito(){
        try { sessionStorage.setItem("verex-carrito", JSON.stringify(_carrito)); } catch(_) {}
    }

    // Envío gratis y regalo sorpresa son incentivos "de progreso" — no
    // cambian el precio como las promos de arriba, solo motivan a agregar
    // una pieza más mostrando cuánto falta para desbloquearlos.
    function _renderProgresoIncentivos(totalActual){
        const cont = document.getElementById("cart-incentivos");
        if(!cont) return;
        const bloques = [];
        if(_envioGratisDesde > 0){
            if(totalActual >= _envioGratisDesde){
                bloques.push(`<div style="background:#dcfce7;color:#166534;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;margin-top:8px;">🚚 ¡Envío GRATIS desbloqueado!</div>`);
            } else {
                const falta = _envioGratisDesde - totalActual;
                bloques.push(`<div style="background:#fef9c3;color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;">🚚 Te faltan $${falta.toFixed(2)} para envío GRATIS</div>`);
            }
        }
        if(_regaloSorpresa){
            if(totalActual >= _regaloSorpresa.monto){
                bloques.push(`<div style="background:#ede9fe;color:#5b21b6;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;margin-top:8px;">🎁 ¡Incluye regalo sorpresa: ${esc(_regaloSorpresa.texto)}!</div>`);
            } else {
                const falta = _regaloSorpresa.monto - totalActual;
                bloques.push(`<div style="background:#fef9c3;color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;">🎁 Te faltan $${falta.toFixed(2)} para un regalo sorpresa</div>`);
            }
        }
        // Monto fijo con mínimo de compra: se repite por tramos, así que
        // siempre avisa cuánto falta para el PRÓXIMO tramo (no solo el primero).
        if(_promoCarrito?.tipo === "montoFijo"){
            const minimo = parseFloat(_promoCarrito.minimoCompra) || 0;
            const base = parseFloat(_promoCarrito.montoFijo) || 0;
            if(minimo > 0){
                const tramosActuales = Math.floor(totalActual / minimo);
                const faltaProximo = (minimo * (tramosActuales + 1)) - totalActual;
                bloques.push(`<div style="background:#fef9c3;color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;">🎁 Te faltan $${faltaProximo.toFixed(2)} para ${tramosActuales > 0 ? "otro" : "el"} descuento de $${base.toFixed(2)}</div>`);
            }
        }
        cont.innerHTML = bloques.join("");
    }

    // Calcula el total del carrito aplicando la promo activa (si hay una).
    // Las 4 variantes comparten la misma base: expandir el carrito a
    // unidades individuales (respetando qty>1) y ordenarlas de mayor a
    // menor precio — así el descuento siempre recae en la(s) pieza(s) más
    // barata(s), protegiendo el margen sin importar en qué orden el
    // cliente las haya agregado.
    function _calcularPromoCarrito(){
        if(!_promoCarrito || !_promoCarrito.tipo) return null;
        const unidades = [];
        _carrito.forEach(it => { for(let i=0;i<it.qty;i++) unidades.push(it.precioUnit); });
        if(!unidades.length) return null;
        unidades.sort((a,b) => b-a);
        const subtotal = unidades.reduce((s,p) => s+p, 0);

        if(_promoCarrito.tipo === "2x50"){
            if(unidades.length < 2) return null;
            let total = 0, descuento = 0;
            unidades.forEach((p, idx) => { if(idx % 2 === 1){ total += p*0.5; descuento += p*0.5; } else total += p; });
            return { total, descuento, etiqueta: "🎁 Promo 2do al 50%" };
        }
        if(_promoCarrito.tipo === "3x2"){
            if(unidades.length < 3) return null;
            let total = 0, descuento = 0;
            unidades.forEach((p, idx) => { if(idx % 3 === 2){ descuento += p; } else total += p; });
            return { total, descuento, etiqueta: "🎁 Promo 3x2 (la más barata gratis)" };
        }
        if(_promoCarrito.tipo === "montoFijo"){
            const base = parseFloat(_promoCarrito.montoFijo) || 0;
            const minimo = parseFloat(_promoCarrito.minimoCompra) || 0;
            let monto;
            if(minimo > 0){
                // Se repite por cada tramo completo — $10 por cada $50 gastados:
                // $100 = 2 tramos = $20 off, $150 = 3 tramos = $30 off.
                const tramos = Math.floor(subtotal / minimo);
                if(tramos < 1) return null;
                monto = Math.min(base * tramos, subtotal);
                if(monto <= 0) return null;
                return { total: subtotal - monto, descuento: monto, etiqueta: `🎁 Descuento de $${monto.toFixed(2)} (${tramos}× $${base.toFixed(2)} por cada $${minimo.toFixed(2)})` };
            }
            monto = Math.min(base, subtotal);
            if(monto <= 0) return null;
            return { total: subtotal - monto, descuento: monto, etiqueta: `🎁 Descuento de $${monto.toFixed(2)}` };
        }
        if(_promoCarrito.tipo === "escalonado"){
            const escalones = [...(_promoCarrito.escalones || [])].sort((a,b) => b.minCant - a.minCant);
            const tier = escalones.find(e => unidades.length >= e.minCant);
            if(!tier) return null;
            const descuento = subtotal * (tier.pct/100);
            return { total: subtotal - descuento, descuento, etiqueta: `🎁 ${tier.pct}% por llevar ${unidades.length} piezas` };
        }
        return null;
    }

    function renderCarritoFab(){
        const total = _carrito.reduce((s, it) => s + it.qty, 0);
        document.getElementById("cart-fab-badge").textContent = total;
        document.getElementById("cart-fab").classList.toggle("show", total > 0);
    }

    function agregarACarrito(p, tallaLabel, precioUnit){
        const key = (p.c || p.n) + "|" + tallaLabel;
        const existente = _carrito.find(it => it.key === key);
        if(existente) existente.qty++;
        else _carrito.push({ key, codigo: p.c || "", nombre: p.n, foto: p.i || "", tallaLabel, precioUnit, qty: 1 });
        guardarCarrito();
        renderCarritoFab();
    }

    function renderCarritoLista(){
        const cont = document.getElementById("cart-list");
        if(!_carrito.length){
            cont.innerHTML = `<p style="text-align:center;color:#999;font-size:13px;padding:20px 0;">${t('tuCarritoVacio')}</p>`;
        } else {
            cont.innerHTML = _carrito.map(it => `
                <div class="cart-item">
                    ${it.foto
                        ? `<img class="cart-item-foto" src="${esc(ikSharp(it.foto))}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'cart-item-foto cart-item-foto-ph\\'>💍</span>'">`
                        : `<span class="cart-item-foto cart-item-foto-ph">💍</span>`}
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:13px;font-weight:700;color:#111;">${esc(traducirNombre(it.nombre))}</div>
                        ${it.tallaLabel ? `<div style="font-size:11px;color:#7c3aed;">${esc(it.tallaLabel)}</div>` : ''}
                        <div style="font-size:12px;color:#666;">$${it.precioUnit.toFixed(2)} ${t('cadaUno')}</div>
                    </div>
                    <button class="cart-item-qtybtn" onclick="cambiarQtyCarrito('${esc(it.key)}',-1)">−</button>
                    <span style="font-weight:700;min-width:16px;text-align:center;">${it.qty}</span>
                    <button class="cart-item-qtybtn" onclick="cambiarQtyCarrito('${esc(it.key)}',1)">+</button>
                    <div style="font-size:13px;font-weight:800;color:#111;min-width:55px;text-align:right;">$${(it.precioUnit*it.qty).toFixed(2)}</div>
                </div>`).join("");
        }
        const subtotal = _carrito.reduce((s, it) => s + it.precioUnit * it.qty, 0);
        const promo = _calcularPromoCarrito();
        const totalEl = document.getElementById("cart-total");
        const promoLineaEl = document.getElementById("cart-promo-linea");
        if(promo){
            totalEl.innerHTML = `<span style="text-decoration:line-through;color:#999;font-size:13px;font-weight:600;">$${subtotal.toFixed(2)}</span> $${promo.total.toFixed(2)}`;
            if(promoLineaEl) promoLineaEl.textContent = `${promo.etiqueta}: -$${promo.descuento.toFixed(2)}`;
            if(promoLineaEl) promoLineaEl.style.display = "block";
        } else {
            totalEl.textContent = "$" + subtotal.toFixed(2);
            if(promoLineaEl) promoLineaEl.style.display = "none";
        }
        _renderProgresoIncentivos(subtotal);
        actualizarTramoEnvio(subtotal);
    }

    // Tramo de envío en vivo (tabla fija de DHL) — se recalcula cada vez que
    // cambia el carrito, mismo lugar donde antes vivían los incentivos de
    // envío gratis / regalo sorpresa (que este catálogo no usa).
    function actualizarTramoEnvio(subtotal){
        const el = document.getElementById("envio-tramo");
        if(!el) return;
        if(!subtotal){ el.className = ""; el.textContent = ""; return; }
        const costo = calcularEnvioCatalogo(subtotal);
        if(costo === null){
            el.className = "bajo-minimo";
            el.textContent = t('envioBajoMinimo', MINIMO_COMPRA_US - subtotal);
            return;
        }
        const siguienteTramo = TRAMOS_ENVIO_US.find(tr => tr.min > subtotal);
        if(siguienteTramo && siguienteTramo.costo < costo){
            el.className = "falta";
            el.textContent = t('envioFalta', costo, siguienteTramo.min - subtotal, siguienteTramo.costo);
        } else {
            el.className = "ok";
            el.textContent = t('envioTramo', costo, subtotal);
        }
    }

    function cambiarQtyCarrito(key, delta){
        const it = _carrito.find(x => x.key === key);
        if(!it) return;
        it.qty += delta;
        if(it.qty <= 0) _carrito = _carrito.filter(x => x.key !== key);
        guardarCarrito();
        renderCarritoFab();
        renderCarritoLista();
        actualizarBotonCarrito();
    }

    // Nombre y teléfono se piden SIEMPRE al enviar el carrito (cliente o
    // afiliado) — un mismo link se puede compartir por varios canales a
    // varios clientes distintos, y sin estos datos no se sabe quién pidió.
    function actualizarBotonCarrito(){
        const nombreInput = document.getElementById("cart-nombre");
        const direccionInput = document.getElementById("cart-direccion");
        const ciudadInput = document.getElementById("cart-ciudad");
        const estadoInput = document.getElementById("cart-estado");
        const zipInput = document.getElementById("cart-zip");
        const correoInput = document.getElementById("cart-correo");
        const telInput = document.getElementById("cart-tel");

        const nombreOk = !!(nombreInput && nombreInput.value.trim().length >= 2);
        const direccionOk = !!(direccionInput && direccionInput.value.trim().length >= 5);
        const ciudadOk = !!(ciudadInput && ciudadInput.value.trim().length >= 2);
        const estadoOk = !!(estadoInput && estadoInput.value);
        const zipOk = !!(zipInput && /^\d{5}$/.test(zipInput.value.trim()));
        const correoOk = !!(correoInput && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correoInput.value.trim()));
        const telOk = !!(telInput && telInput.value.trim().length >= 7);

        if(zipInput)    zipInput.classList.toggle("form-err", !!(zipInput.value.trim() && !zipOk));
        if(correoInput) correoInput.classList.toggle("form-err", !!(correoInput.value.trim() && !correoOk));

        const subtotal = _carrito.reduce((s, it) => s + it.precioUnit * it.qty, 0);
        const envioOk = calcularEnvioCatalogo(subtotal) !== null;

        const btn = document.getElementById("cart-confirm");
        const listo = _carrito.length > 0 && nombreOk && direccionOk && ciudadOk && estadoOk && zipOk && correoOk && telOk && envioOk;
        btn.disabled = !listo;
        btn.style.opacity = listo ? "1" : ".5";
    }

    function abrirCarrito(){
        renderCarritoLista();
        actualizarBotonCarrito();
        document.getElementById("cart-overlay").classList.add("open");
    }

    function cerrarCarrito(){
        document.getElementById("cart-overlay").classList.remove("open");
    }

    function enviarCarritoWhatsApp(){
        if(!_carrito.length) return;
        const nombreCliente = (document.getElementById("cart-nombre")?.value || "").trim();
        const direccion = (document.getElementById("cart-direccion")?.value || "").trim();
        const ciudad = (document.getElementById("cart-ciudad")?.value || "").trim();
        const estado = (document.getElementById("cart-estado")?.value || "").trim();
        const zip = (document.getElementById("cart-zip")?.value || "").trim();
        const correo = (document.getElementById("cart-correo")?.value || "").trim();
        const tel = (document.getElementById("cart-tel")?.value || "").trim();
        if(!nombreCliente || nombreCliente.length < 2 || !direccion || !ciudad || !estado
            || !/^\d{5}$/.test(zip) || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo) || tel.length < 7) return;

        // Un solo string de dirección — igual que hace el catálogo doméstico
        // con su textarea única — para no tocar registrarLead() ni el resto
        // del flujo, que ya tratan la dirección como un solo campo de texto.
        const direccionCliente = `${direccion}, ${ciudad}, ${estado} ${zip}`;

        const lineas = _carrito.map((it, idx) =>
            `${idx+1}. ${traducirNombre(it.nombre)}${it.tallaLabel ? ` (${it.tallaLabel})` : ''}${it.qty > 1 ? ` x${it.qty}` : ''} — $${(it.precioUnit*it.qty).toFixed(2)}`
        );
        const subtotal = _carrito.reduce((s, it) => s + it.precioUnit * it.qty, 0);
        const costoEnvio = calcularEnvioCatalogo(subtotal);
        if(costoEnvio === null) return; // el botón ya lo bloquea antes de llegar aquí
        const totalFinal = subtotal + costoEnvio;
        const totalLinea = `${t('waEnvio')} ${costoEnvio > 0 ? "$" + costoEnvio.toFixed(2) : t('waGratis')}\n${t('waTotal')} $${totalFinal.toFixed(2)}`;
        // Link de pago con el monto EXACTO del pedido — PayPal.me acepta el
        // monto directo en la URL, así no hace falta un botón de precio fijo
        // por cada tramo de envío.
        const linkPago = `https://paypal.me/${PAYPAL_ME_USER}/${totalFinal.toFixed(2)}USD`;

        const msg = `${t('waMsgCarritoHola', nombreCliente)}\n\n${lineas.join("\n")}\n\n${totalLinea}\n\n${t('waMisDatos')}\n${t('waTelefono')} ${tel}\n${t('waCorreo')} ${correo}\n${t('waDireccion')} ${direccionCliente}`;

        // Registro de lead best-effort por cada producto del carrito — igual
        // que el flujo directo, no debe bloquear el envío si falla. pedidoId
        // agrupa las líneas de este mismo pedido para el panel de Logística
        // USA (un lead por producto, igual que el catálogo doméstico).
        const pedidoId = "US" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        _carrito.forEach(it => {
            const prod = _prods.find(p => p.c === it.codigo);
            if(prod) registrarLead(prod, {
                telefono: tel, nombreCliente, direccionCliente, correoCliente: correo,
                pedidoId, qty: it.qty, precioLinea: it.precioUnit,
                ciudad, estadoUS: estado, zip, envio: costoEnvio, totalPedido: totalFinal, pagoLink: linkPago
            });
        });

        // Un solo correo con el pedido COMPLETO a hola@verexstore.com — en
        // paralelo al WhatsApp, no en su lugar. No depende de que el cliente
        // llegue a presionar "enviar" en su WhatsApp (que en EE. UU. no es
        // algo garantizado como en El Salvador), así que este es el aviso
        // confiable de que entró un pedido nuevo. Incluye el link de PayPal
        // ya armado con el monto exacto, listo para copiar y mandar.
        try {
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    accion: "ENVIAR_PEDIDO_USA",
                    nombreCliente, telefono: tel, correo, direccionCompleta: direccionCliente,
                    items: _carrito.map(it => ({ nombre: it.nombre, qty: it.qty, precio: it.precioUnit, foto: ikSharp(_prods.find(p => p.c === it.codigo)?.i || "") })),
                    envio: costoEnvio, total: totalFinal, pagoLink: linkPago, lang: _lang
                })
            }).catch(()=>{});
        } catch(_){}

        _carrito = [];
        guardarCarrito();
        renderCarritoFab();
        cerrarCarrito();
        window.open(`https://wa.me/${_waNum}?text=${encodeURIComponent(msg)}`,"_blank");
    }

    // Verifica el stock real contra el catálogo (que es una foto fija tomada al
    // generar el link) y marca "AGOTADO" lo que ya se vendió por otro canal
    // (consignación, ecommerce u otro afiliado) desde entonces.
    async function actualizarDisponibilidad(){
        try{
            const res = await fetch(API_URL, {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ accion:"GET_STOCK" })
            });
            const data = await res.json();
            const stock = data.stock || [];
            const mapa = new Map(stock.map(s => [s.codigo, s]));

            // Tallas REALMENTE en existencia ahora mismo — cada talla de un
            // mismo modelo es un código de stock distinto que comparte
            // codigoBase (ej. AN001T6, AN001T7 comparten codigoBase AN001).
            // Se agrupa todo el stock por codigoBase para poder preguntar
            // "¿qué tallas de este modelo tienen unidades en bodega ahora?"
            // en vez de confiar solo en la lista fija que trae el catálogo
            // desde que se generó el link.
            const stockPorBase = new Map();
            stock.forEach(s => {
                const base = s.codigoBase || s.codigo;
                if(!base) return;
                if(!stockPorBase.has(base)) stockPorBase.set(base, []);
                stockPorBase.get(base).push(s);
            });
            // En parejas, dama y caballero a veces COMPARTEN el mismo
            // codigoBase (ej. ANP060DT6 y ANP060CT9 → codigoBase "ANP060"
            // para ambos), distinguidos solo por la letra de rol (D/C/...)
            // justo antes de la "T" de la talla en el código. Sin esto, las
            // tallas de dama y caballero se mezclarían en un solo grupo.
            const rolDe = rec => {
                const base = String(rec.codigoBase || rec.codigo || "");
                const resto = String(rec.codigo || "").slice(base.length);
                const m = resto.match(/^(.*?)T\d/);
                return m ? m[1] : "";
            };
            // Tallas con unidades en bodega del modelo (y, si se pide, del
            // mismo rol dama/caballero) al que pertenece ese código
            // representativo — null si el código no aparece en stock (ahí
            // no se toca la lista que ya traía el catálogo).
            const tallasVivasDe = (codigo, filtrarPorRol) => {
                const rec = mapa.get(codigo);
                if(!rec) return null;
                const base = rec.codigoBase || rec.codigo;
                const rol = filtrarPorRol ? rolDe(rec) : null;
                const tallas = [...new Set(
                    (stockPorBase.get(base) || [])
                        .filter(s => (!filtrarPorRol || rolDe(s) === rol) && !s.reservado && (parseInt(s.stock_bodega)||0) > 0 && s.talla)
                        .map(s => String(s.talla))
                )];
                return tallas.length ? tallas.sort((a,b)=>parseFloat(a)-parseFloat(b)) : null;
            };
            // Igual que arriba, pero uniendo varios códigos representativos
            // (un "trío" puede traer 2 diseños de dama en cD) — si CUALQUIERA
            // de los códigos no se puede verificar, se deja la lista
            // original completa en vez de reemplazarla a medias.
            const tallasVivasDeVarios = (codigos, filtrarPorRol) => {
                const resultados = (codigos||[]).map(c => tallasVivasDe(c, filtrarPorRol));
                if(!resultados.length || resultados.some(r => r === null)) return null;
                return [...new Set(resultados.flat())].sort((a,b)=>parseFloat(a)-parseFloat(b));
            };

            // Este catálogo (EE. UU./DHL) tiene su propia franja de confianza y
            // su propia tabla de envío fija — a propósito NO se sincroniza con
            // las reglas de envío ni la frase de confianza del catálogo
            // doméstico (Admin → Dashboard), que están pensadas para El Salvador.

            // Catálogos auto-generados por un vendedor desde su inventario
            // (ver inventario-sellers → compartirMiCatalogo): la tabla "stock"
            // global no baja stock_consignacion cuando el vendedor registra
            // una venta (solo sube stock_vendido), así que el chequeo genérico
            // de abajo nunca los marcaría agotados. Se cruza en cambio contra
            // SU consignación real — es la fuente exacta de qué le queda.
            let vivosVendedorPorClave = null;
            // Clave = codigoBase + talla — el codigoBase solo no alcanza
            // porque un anillo con varias tallas genera UNA tarjeta por
            // talla en el catálogo, todas con el mismo codigoBase; sin la
            // talla en la clave no se puede saber CUÁL talla exacta sigue
            // viva y cuál se agotó (podía marcar todas o ninguna agotada).
            const claveVivo = (base, talla) => String(base||"").toUpperCase() + "|" + String(talla||"").trim();
            if (_afiliadoCodigo && _esAutoGeneradoVendedor) {
                try {
                    const resV = await fetch(API_URL, {
                        method: "POST", headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({ accion: "GET_CODIGOS_VENDEDOR", vendedor: _afiliadoCodigo })
                    });
                    const dataV = await resV.json();
                    if (dataV.ok && dataV.productos) {
                        // Incluye "bajo pedido" (misma talla, se repone) y
                        // "tallasDisponibles" (esa talla se agotó pero el
                        // modelo tiene otras tallas en bodega) — en ambos
                        // casos la tarjeta se sigue mostrando, no se oculta.
                        vivosVendedorPorClave = new Map();
                        dataV.productos.forEach(p => {
                            const base = (p.codigoBase || p.codigo || "").replace(/-\d+$/, "");
                            vivosVendedorPorClave.set(claveVivo(base, p.talla), p);
                        });
                    }
                } catch(_) {}
            }

            _prods.forEach((p,i) => {
                if(!p.c) return;
                const s = mapa.get(p.c);
                const card = document.querySelector(`.card[data-idx="${i}"]`);

                // Refrescar la foto si cambió en Stock desde que se generó el link —
                // así no hace falta regenerar el catálogo solo por una foto nueva.
                if(s?.foto && s.foto !== p.i){
                    p.i = s.foto;
                    const img = card?.querySelector(".card-img");
                    if(img) img.src = ikSharp(s.foto);
                }

                // Refrescar el precio si cambió en Stock — así un ajuste de precio
                // aplica solo, sin tener que regenerar el link.
                let precioCambio = false;
                if(!p.par && s && s.precio != null && parseFloat(s.precio) !== parseFloat(p.p)){
                    p.p = parseFloat(s.precio).toFixed(2);
                    precioCambio = true;
                } else if(p.par && (p.cD?.length || p.cC?.length)){
                    // Pares/tríos: el catálogo guarda el código de CADA pieza del set,
                    // así que se suma el precio actual de cada una para recalcular el total.
                    const sumar = codigos => (codigos||[]).reduce((sum, cod) => {
                        const row = mapa.get(cod);
                        return sum + (row ? parseFloat(row.precio || 0) : 0);
                    }, 0);
                    if(p.cD?.length){
                        const nuevoD = sumar(p.cD).toFixed(2);
                        if(nuevoD !== parseFloat(p.pD||0).toFixed(2)){ p.pD = nuevoD; precioCambio = true; }
                    }
                    if(p.cC?.length){
                        const nuevoC = sumar(p.cC).toFixed(2);
                        if(nuevoC !== parseFloat(p.pH||0).toFixed(2)){ p.pH = nuevoC; precioCambio = true; }
                    }
                }
                if(precioCambio){
                    const priceEl = document.getElementById(`price-${i}`);
                    if(priceEl) priceEl.innerHTML = renderPrecioHtml(p);
                }

                // Refrescar las tallas con lo que hay AHORA en bodega —
                // reemplaza la lista fija del catálogo (o el rango genérico
                // de respaldo si no traía ninguna) por la disponibilidad
                // real. elegirTalla() lee p.sizes/p.sizesD/p.sizesH recién
                // al abrir el selector, así que ya toma este valor corregido
                // sin necesidad de volver a renderizar la tarjeta.
                if(p.par){
                    if(p.cD?.length){ const v = tallasVivasDeVarios(p.cD, true); if(v) p.sizesD = v; }
                    if(p.cC?.length){ const v = tallasVivasDeVarios(p.cC, true); if(v) p.sizesH = v; }
                } else if(p.cat === "AN" && p.c){
                    const v = tallasVivasDe(p.c, false);
                    if(v) p.sizes = v;
                }

                // Si el código ya no existe en stock (eliminado), fue reservado,
                // o ya no queda en BODEGA, se marca agotado para este catálogo.
                //
                // Antes se sumaba bodega+tienda+consignación (como
                // _stockTotalProd del admin), pero eso significaba que una
                // pieza ya entregada a OTRO vendedor en consignación seguía
                // apareciendo disponible aquí — un catálogo de afiliado podía
                // mostrar productos que en realidad estaban con otro vendedor.
                // Solo bodega representa lo que VEREX puede entregar a un
                // cliente nuevo de ESTE catálogo.
                const sinUnidades = row => !row || row.reservado || (parseInt(row.stock_bodega)||0) <= 0;

                // Pares y tríos: el set solo se puede armar si TODAS sus piezas
                // tienen unidades. Antes se miraba solo el código principal, así
                // que el par seguía ofreciéndose aunque la otra pieza ya se
                // hubiera vendido por consignación, otro afiliado o la tienda —
                // y el cliente terminaba pidiendo algo imposible de completar.
                // Los códigos de cada pieza ya vienen en el catálogo (cD/cC), que
                // es lo mismo que se usa arriba para recalcular el precio del set.
                const piezas = (p.par ? [...(p.cD||[]), ...(p.cC||[])] : []).filter(Boolean);

                const claveCard = claveVivo(p.c, (p.sizes && p.sizes[0]) || "");
                const vivoInfo = vivosVendedorPorClave ? vivosVendedorPorClave.get(claveCard) : undefined;
                const agotado = vivosVendedorPorClave
                    ? !vivoInfo
                    : (piezas.length
                        ? piezas.some(cod => sinUnidades(mapa.get(cod)))
                        : sinUnidades(s));

                if (vivosVendedorPorClave && card) {
                    p.bajoPedido = !!vivoInfo?.bajoPedido;
                    p.tallasDisponibles = vivoInfo?.tallasDisponibles || [];
                    card.classList.toggle("bajopedido", p.bajoPedido);
                    card.classList.toggle("otrastallas", !p.bajoPedido && p.tallasDisponibles.length > 0);
                    const badgeOT = document.getElementById(`otrastallas-${i}`);
                    if (badgeOT && p.tallasDisponibles.length) badgeOT.textContent = `${t('tallaAgotadaDisp')} ${p.tallasDisponibles.join(", ")}`;
                }

                if(!agotado) return;
                p._agotado = true;
                // Ocultar en vez de tachar — más limpio para el cliente, y evita
                // que quede un producto "muerto" ocupando espacio en la lista.
                if(card) card.style.display = "none";
            });
        } catch(_){ /* si falla la verificación, se deja el catálogo como estaba */ }
    }

    function abrirFotoZoom(url){
        document.getElementById("foto-zoom-img").src = url;
        document.getElementById("foto-zoom-overlay").style.display = "flex";
    }
    function cerrarFotoZoom(){
        document.getElementById("foto-zoom-overlay").style.display = "none";
    }

    window.cambiarIdioma   = cambiarIdioma;
    window.elegirTalla     = elegirTalla;
    window.selSz           = selSz;
    window.confirmarTalla  = confirmarTalla;
    window.cerrarTallas    = cerrarTallas;
    window.actualizarBotonSz = actualizarBotonSz;
    window.abrirFotoZoom  = abrirFotoZoom;
    window.cerrarFotoZoom = cerrarFotoZoom;
    window.abrirCarrito   = abrirCarrito;
    window.cerrarCarrito  = cerrarCarrito;
    window.abrirInfo      = abrirInfo;
    window.cerrarInfo     = cerrarInfo;
    window.toggleTerminos = toggleTerminos;
    window.cambiarQtyCarrito     = cambiarQtyCarrito;
    window.actualizarBotonCarrito = actualizarBotonCarrito;
    window.enviarCarritoWhatsApp  = enviarCarritoWhatsApp;
    window.toggleFiltroTalla = toggleFiltroTalla;
    window.limpiarFiltroTalla = limpiarFiltroTalla;
    window._abrirRegaloPromo = _abrirRegaloPromo;
    window._carruselIrA = _carruselIrA;

    /* ── Arranque ── */

    let data;
    // KV route: data injected server-side
    if(window.__CATALOG_DATA__){
        data = window.__CATALOG_DATA__;
    } else {
        if(!c){
            document.getElementById("app").innerHTML='<div style="text-align:center;padding:60px;color:#888;">Link inválido.</div>';
            return;
        }
        try{
            // Try LZ-string URL-safe (new), then base64 LZ-string, then plain base64 (legacy)
            const lzUri = LZString.decompressFromEncodedURIComponent(c);
            if(lzUri){ data=JSON.parse(lzUri); }
            else {
                const raw=decodeURIComponent(c);
                const lzB64=LZString.decompressFromBase64(raw);
                data=lzB64 ? JSON.parse(lzB64) : JSON.parse(decodeURIComponent(escape(atob(raw))));
            }
        } catch(e){
            document.getElementById("app").innerHTML='<div style="text-align:center;padding:60px;color:#888;">Link inválido o corrupto.</div>';
            return;
        }
    }
    if(data.expiry && Date.now()>data.expiry) showExpired(data.nombre, data.wa);
    else { render(data); actualizarDisponibilidad(); renderCarritoFab(); aplicarIdiomaEstatico(); }
})();
</script>

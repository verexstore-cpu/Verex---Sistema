<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>VEREX · Catálogo</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;}

        header{background:#111;text-align:center;padding:10px 16px;}
        header img.logo{width:260px;max-width:80vw;display:block;margin:0 auto;}

        .info-bar{
            background:#fff;border-bottom:1px solid #e2e2e2;
            padding:10px 16px;text-align:center;font-size:13px;color:#555;
        }
        .info-bar strong{color:#111;}

        /* Filtro de talla — solo aparece si el catálogo tiene anillos */
        #filtro-talla-bar{
            background:#fff;border-bottom:1px solid #e2e2e2;
            padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
        }
        #filtro-talla-bar .flt-lbl{font-size:11px;font-weight:700;color:#555;margin-right:2px;}
        .chip-talla{
            padding:5px 11px;border-radius:20px;border:1.5px solid #ddd;background:#fff;
            color:#111;font-size:11px;font-weight:700;cursor:pointer;
        }
        .chip-talla.activa{background:#0277bd;color:#fff;border-color:#0277bd;}
        .chip-talla-limpiar{
            padding:5px 11px;border-radius:20px;border:none;background:#f0f0f0;
            color:#888;font-size:11px;font-weight:700;cursor:pointer;
        }
        .card.oculto-talla{display:none;}
        .validez{color:#f97316;font-weight:700;font-size:12px;margin-top:4px;}

        .grid{
            display:grid;grid-template-columns:repeat(2,1fr);
            gap:12px;padding:16px;max-width:580px;margin:0 auto;
        }

        .card{background:#fff;border:1.5px solid #d9c184;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;}
        .card-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f7f7f7;display:block;flex-shrink:0;}
        .card-img-ph{
            width:100%;aspect-ratio:1/1;background:#f0f0f0;
            display:flex;align-items:center;justify-content:center;
            font-size:36px;color:#ccc;flex-shrink:0;
        }
        .card-body{padding:10px;text-align:center;flex:1;}
        .card-name{font-size:12px;font-weight:700;color:#1a1a1a;line-height:1.3;margin-bottom:3px;}
        .card-material{
            display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.02em;
            padding:2px 8px;border-radius:20px;margin-bottom:5px;
        }
        .card-material.mat-plata{background:#e5e7eb;color:#374151;border:1px solid #cbd5e1;}
        .card-material.mat-acero{background:#dbeafe;color:#1e3a8a;border:1px solid #93c5fd;}
        .card-material.mat-oro{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
        .card-material.mat-otro{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;}
        .card-price{font-size:16px;font-weight:800;color:#111;margin-bottom:4px;}
        .card-price-orig{font-size:12px;font-weight:600;color:#9ca3af;text-decoration:line-through;}
        .card-price-final{font-size:17px;font-weight:800;color:#92400e;}
        .card-ne{display:inline-block;font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:5px;padding:2px 7px;margin-bottom:4px;line-height:1.5;}
        .card-nota{display:inline-block;font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:5px;padding:2px 7px;margin-top:5px;line-height:1.5;}
        .card-footer{padding:0 10px 10px;display:flex;flex-direction:column;gap:5px;}
        .wa-order{
            width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:2px;text-align:center;position:relative;overflow:hidden;
            background:linear-gradient(135deg,#B8933E,#D4AF5E);
            color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
            padding:10px 8px 9px;border-radius:12px;
            border:none;
            box-shadow:0 0 0 0 rgba(184,147,62,.5);
            cursor:pointer;
            animation:waPulse 2.4s ease-out infinite;
        }
        .wa-order:active{ filter:brightness(.9);transform:scale(.97); }
        .wa-order .wa-main{ font-size:13px;font-weight:800;position:relative;z-index:2; }
        .wa-order .wa-sub{ font-size:10px;font-weight:500;opacity:.88;position:relative;z-index:2; }
        @keyframes waPulse{
            0%  {box-shadow:0 0 0 0 rgba(184,147,62,.55);}
            65% {box-shadow:0 0 0 8px rgba(184,147,62,.0);}
            100%{box-shadow:0 0 0 0 rgba(184,147,62,.0);}
        }
        .wa-shine{
            position:absolute;top:0;left:-60%;width:40%;height:100%;
            background:linear-gradient(120deg,transparent,rgba(255,255,255,.85),transparent);
            transform:skewX(-20deg);pointer-events:none;
        }
        .wa-order.brillando .wa-shine{ animation:waShineSweep .6s ease; }
        @keyframes waShineSweep{ from{left:-60%;} to{left:130%;} }
        @keyframes doradoShine{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        /* Regalo del banner promo: bamboleo suave hasta que se toca/abre */
        @keyframes giftWiggle{
            0%,100%{transform:rotate(0deg);}
            20%{transform:rotate(-12deg);}
            40%{transform:rotate(10deg);}
            60%{transform:rotate(-6deg);}
            80%{transform:rotate(4deg);}
        }
        #promo2x50-icon{ display:inline-block; font-size:26px; animation:giftWiggle 1.8s ease-in-out infinite; cursor:pointer; }
        #promo2x50-icon.abierto{ animation:none; transform:scale(1.3); }
        @keyframes confettiFall{
            0%{ transform:translateY(0) rotate(0deg); opacity:1; }
            100%{ transform:translateY(70px) rotate(360deg); opacity:0; }
        }
        .confetti-bit{
            position:absolute; top:0; left:50%; width:6px; height:10px;
            pointer-events:none; animation:confettiFall 900ms ease-out forwards;
        }
        /* Lluvia de confeti a pantalla completa — anuncia la promo una sola
           vez al cargar, cayendo desde arriba del todo, no solo cerca del
           ícono del banner. */
        @keyframes confettiRainFall{
            0%{ transform:translateY(-20px) rotate(0deg); opacity:1; }
            100%{ transform:translateY(105vh) rotate(720deg); opacity:.9; }
        }
        #confetti-rain-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
        .confetti-rain-bit{ position:absolute; top:-20px; pointer-events:none; animation:confettiRainFall linear forwards; }
        .cart-add{
            align-self:flex-end;width:44px;
            background:#fff;color:#111;border:1.5px solid #ddd;
            border-radius:8px;font-size:13px;cursor:pointer;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:5px 4px 4px;gap:1px;line-height:1;
        }
        .cart-add .cart-label{
            font-size:7.5px;font-weight:600;color:#888;text-align:center;line-height:1.2;
        }

        /* Carrito flotante — discreto, no interrumpe el catálogo hasta que
           se agrega el primer producto. */
        #cart-fab{
            display:none;position:fixed;bottom:20px;right:16px;z-index:900;
            background:#111;color:#fff;border:none;border-radius:50px;
            padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;
            box-shadow:0 4px 15px rgba(0,0,0,.3);align-items:center;gap:8px;
        }
        #cart-fab.show{display:flex;}
        #cart-fab-badge{
            background:#25D366;color:#fff;border-radius:50%;
            width:20px;height:20px;font-size:11px;font-weight:800;
            display:flex;align-items:center;justify-content:center;
        }
        #cart-overlay{
            display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
            z-index:999;align-items:flex-end;justify-content:center;
        }
        #cart-overlay.open{display:flex;}
        #cart-box{
            background:#fff;border-radius:16px 16px 0 0;
            padding:20px 16px 24px;width:100%;max-width:480px;
            max-height:80vh;overflow-y:auto;
        }
        .cart-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;}
        .cart-item-qtybtn{
            width:26px;height:26px;border-radius:50%;border:1px solid #ddd;
            background:#f7f7f7;font-size:14px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
        }

        /* Agotado (verificado en tiempo real contra el stock actual) */
        .card.agotado{opacity:.6;}
        .card.agotado .card-img,.card.agotado .card-img-ph{filter:grayscale(1);}
        .card-agotado-badge{
            display:none;position:absolute;top:8px;left:8px;
            background:#ef4444;color:#fff;font-size:10px;font-weight:800;
            padding:3px 8px;border-radius:5px;letter-spacing:.3px;z-index:2;
        }
        .card.agotado .card-agotado-badge{display:block;}
        .card.agotado .wa-order{background:#9ca3af;cursor:not-allowed;}
        .card-img-wrap{position:relative;}

        /* Vencido */
        .expired{
            display:flex;flex-direction:column;align-items:center;
            justify-content:center;text-align:center;
            padding:60px 30px;min-height:65vh;
        }
        .exp-icon{font-size:64px;margin-bottom:20px;}
        .expired h2{font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:10px;}
        .expired p{font-size:14px;color:#666;margin-bottom:28px;line-height:1.6;max-width:280px;}
        .wa-btn{
            display:inline-flex;align-items:center;gap:8px;
            background:#25D366;color:#fff;padding:14px 28px;
            border-radius:10px;font-size:15px;font-weight:700;
            text-decoration:none;
        }

        footer{text-align:center;padding:20px;font-size:11px;color:#aaa;}
        #loading{text-align:center;padding:80px 20px;color:#888;font-size:14px;}
        @media(max-width:340px){.grid{grid-template-columns:1fr;}}

        /* Selector de talla */
        #sz-overlay{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,.5);z-index:999;
            align-items:flex-end;justify-content:center;
        }
        #sz-overlay.open{display:flex;}
        #sz-box{
            background:#fff;border-radius:16px 16px 0 0;
            padding:20px 16px 32px;width:100%;max-width:480px;
            max-height:90vh;overflow-y:auto;
        }
        .sz-btn{
            padding:8px 10px;border:2px solid #e2e2e2;border-radius:8px;
            font-weight:700;font-size:13px;background:#fff;cursor:pointer;min-width:44px;
        }
        .sz-btn.sel-d{background:#7c3aed;border-color:#7c3aed;color:#fff;}
        .sz-btn.sel-h{background:#0277bd;border-color:#0277bd;color:#fff;}
    </style>
</head>
<body>
<div id="app"><div id="loading">Cargando catálogo…</div></div>

<!-- Zoom de foto -->
<div id="foto-zoom-overlay" onclick="cerrarFotoZoom()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1200;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;">
    <img id="foto-zoom-img" src="" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;">
</div>

<!-- Carrito flotante — discreto, aparece solo cuando hay algo agregado -->
<button id="cart-fab" onclick="abrirCarrito()">
    🛒 <span id="cart-fab-badge">0</span>
</button>

<div id="cart-overlay">
    <div id="cart-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div style="font-weight:800;font-size:15px;color:#111;">🛒 Tu pedido</div>
            <button onclick="cerrarCarrito()" style="background:none;border:none;font-size:20px;color:#999;cursor:pointer;">✕</button>
        </div>
        <div id="cart-list"></div>
        <div id="cart-promo-linea" style="display:none;text-align:right;font-size:12px;font-weight:700;color:#7c3aed;margin-top:2px;"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:15px;font-weight:800;color:#111;">
            <span>Total</span><span id="cart-total">$0.00</span>
        </div>
        <div id="cart-incentivos"></div>
        <div id="cart-datos-wrap" style="margin-bottom:14px;">
            <div style="font-size:12px;font-weight:700;color:#111;margin-bottom:6px;">Tu nombre</div>
            <input type="text" id="cart-nombre" placeholder="Ej: María Pérez"
                oninput="actualizarBotonCarrito()"
                style="width:100%;padding:12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px;box-sizing:border-box;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:700;color:#111;margin-bottom:6px;">Tu número de WhatsApp</div>
            <input type="tel" id="cart-tel" placeholder="Ej: 7000-0000" inputmode="numeric"
                oninput="actualizarBotonCarrito()"
                style="width:100%;padding:12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px;box-sizing:border-box;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:700;color:#111;margin-bottom:6px;">Dirección completa de envío <span style="color:#999;font-weight:500;">(departamento, municipio y dirección exacta)</span></div>
            <textarea id="cart-direccion" placeholder="Ej: San Salvador, Mejicanos, Col. Las Flores, Calle Principal #12"
                oninput="actualizarBotonCarrito()" rows="2"
                style="width:100%;padding:12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px;box-sizing:border-box;resize:vertical;font-family:inherit;"></textarea>
        </div>
        <button id="cart-confirm" onclick="enviarCarritoWhatsApp()"
            style="width:100%;background:#25D366;color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;">
            📱 Enviar pedido por WhatsApp</button>
        <button onclick="cerrarCarrito()"
            style="width:100%;background:#f0f2f5;color:#555;border:none;padding:11px;border-radius:10px;font-size:14px;cursor:pointer;">
            Seguir viendo el catálogo</button>
    </div>
</div>

<div id="mini-toast" style="display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;z-index:1300;box-shadow:0 4px 15px rgba(0,0,0,.3);"></div>

<!-- Selector de talla -->
<div id="sz-overlay">
    <div id="sz-box">
        <div id="sz-title" style="font-weight:800;font-size:15px;color:#111;text-align:center;margin-bottom:4px;line-height:1.3;"></div>
        <div id="sz-sub" style="font-size:12px;color:#888;text-align:center;margin-bottom:18px;"></div>

        <div id="sz-sec-d">
            <div id="sz-lbl-d" style="font-size:12px;font-weight:700;color:#7c3aed;margin-bottom:8px;"></div>
            <div id="sz-grid-d" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;"></div>
        </div>

        <div id="sz-sec-h" style="display:none;">
            <div style="font-size:12px;font-weight:700;color:#0277bd;margin-bottom:8px;">Talla caballero</div>
            <div id="sz-grid-h" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;"></div>
        </div>

        <div id="sz-tel-wrap" style="display:none;margin-bottom:18px;">
            <div style="font-size:12px;font-weight:700;color:#111;margin-bottom:6px;">Tu nombre</div>
            <input type="text" id="sz-nombre" placeholder="Ej: María Pérez"
                oninput="actualizarBotonSz()"
                style="width:100%;padding:12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px;box-sizing:border-box;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:700;color:#111;margin-bottom:6px;">Tu número de WhatsApp</div>
            <input type="tel" id="sz-tel" placeholder="Ej: 7000-0000" inputmode="numeric"
                oninput="actualizarBotonSz()"
                style="width:100%;padding:12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px;box-sizing:border-box;margin-bottom:10px;">
            <div style="font-size:12px;font-weight:700;color:#111;margin-bottom:6px;">Dirección completa de envío <span style="color:#999;font-weight:500;">(departamento, municipio y dirección exacta)</span></div>
            <textarea id="sz-direccion" placeholder="Ej: San Salvador, Mejicanos, Col. Las Flores, Calle Principal #12"
                oninput="actualizarBotonSz()" rows="2"
                style="width:100%;padding:12px;border:2px solid #e2e2e2;border-radius:10px;font-size:15px;box-sizing:border-box;resize:vertical;font-family:inherit;"></textarea>
        </div>

        <button id="sz-confirm" onclick="confirmarTalla()"
            style="width:100%;background:#25D366;color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;opacity:.5;"
            disabled>💬 Enviar por WhatsApp</button>
        <button onclick="cerrarTallas()"
            style="width:100%;background:#f0f2f5;color:#555;border:none;padding:11px;border-radius:10px;font-size:14px;cursor:pointer;">
            Cancelar</button>
    </div>
</div>

<script>
(function(){
    const params = new URLSearchParams(location.search);
    const c = params.get("c");

    let _prods = [], _waNum = "", _szIdx = -1, _szD = "", _szH = "", _descPct = 0, _afiliadoCodigo = "", _szParMode = false, _szTel = "", _szNombreCliente = "", _szDireccion = "", _szNoTalla = false, _szModo = "wa";
    // _promoCarrito: { tipo: '2x50'|'3x2'|'montoFijo'|'escalonado', montoFijo, escalones }
    let _promoCarrito = null, _promo2x50 = false; // _promo2x50 se mantiene solo por compatibilidad con links viejos
    let _envioGratisDesde = 0, _regaloSorpresa = null; // { monto, texto }
    let _carrito = [];
    try { _carrito = JSON.parse(sessionStorage.getItem("verex-carrito") || "[]"); } catch(_) {}

    const SIZES   = ["5","5.5","6","6.5","7","7.5","8","8.5","9","9.5","10","10.5","11","12","13","14"];
    const ES_PAR  = /matrimonio|novios|pareja|alianza/i;
    const API_URL = "https://verex-api.verexstore.workers.dev/";

    function esc(s){
        const d=document.createElement("div"); d.textContent=String(s||""); return d.innerHTML;
    }

    // Clase de color del badge de material — para que el cliente note de
    // un vistazo si es plata, acero u oro laminado sin tener que leer el texto.
    function claseMaterial(m){
        const s = String(m||"").toLowerCase();
        if(s.includes("acero"))                     return "mat-acero";
        if(s.includes("oro"))                        return "mat-oro";
        if(s.includes("plata"))                      return "mat-plata";
        return "mat-otro";
    }

    // Registro silencioso del interés del cliente ANTES de abrir WhatsApp — no bloquea
    // la apertura del chat aunque falle (la venta nunca debe depender de esto).
    function registrarLead(p, telefono, nombreCliente, direccionCliente){
        if (!p?.c) return;
        try {
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    accion: "REGISTRAR_LEAD",
                    afiliado: _afiliadoCodigo || "",
                    codigo: p.c,
                    nombre: p.n || "",
                    precio: precioFinal(p.p),
                    foto: p.i || "",
                    // Teléfono y nombre capturados ANTES de abrir WhatsApp — si el
                    // envío falla o el cliente no lo manda, ya queda un dato de
                    // contacto guardado, en vez de un Lead sin nadie a quién
                    // darle seguimiento. Antes solo se pedía en catálogo de
                    // afiliado; ahora se pide siempre (también en cliente) porque
                    // un mismo link se puede compartir a varios clientes distintos
                    // por distintos canales, y sin nombre no se sabe quién pidió.
                    telefonoCliente: telefono || "",
                    nombreCliente: nombreCliente || "",
                    direccionCliente: direccionCliente || ""
                })
            }).catch(()=>{});
        } catch(_){}
    }

    function precioFinal(precio){
        const n = parseFloat(precio) || 0;
        if (!_descPct) return n;
        return Math.round(n * (1 - _descPct / 100) * 100) / 100;
    }

    // Genera el bloque de precio de una tarjeta — usado en el render inicial
    // y de nuevo por actualizarDisponibilidad() cuando el precio cambió en
    // Stock desde que se generó el catálogo (sin necesidad de regenerar el link).
    function renderPrecioHtml(p){
        const totalSet = (p.par && p.pD != null && p.pH != null)
            ? parseFloat(p.pD) + parseFloat(p.pH) : null;
        if (totalSet != null) {
            const piezas = p.piezas || 2;
            const nDama = piezas - 1; // hoy: 1 o 2 anillos dama + 1 caballero
            const label = piezas === 2
                ? "Precio del par (dama + caballero)"
                : piezas === 3
                    ? "Precio del trío (2 anillos dama + 1 caballero)"
                    : `Precio del set (${piezas} piezas)`;
            const precioTxt = _descPct
                ? `<span class="card-price-orig">$${totalSet.toFixed(2)}</span> <span class="card-price-final">$${precioFinal(totalSet).toFixed(2)}</span>`
                : `$${totalSet.toFixed(2)}`;
            // Sin desglose Dama/Caballero — estos sets solo se venden completos
            // (nunca por pieza suelta), así que mostrar el reparto interno del
            // precio no aporta nada y puede confundir al cliente.
            return `${precioTxt}<span style="display:block;font-size:10px;font-weight:700;color:#7c3aed;margin-top:2px;">${label}</span>`;
        }
        const base = _descPct
            ? `<span class="card-price-orig">$${esc(p.p)}</span> <span class="card-price-final">$${precioFinal(p.p).toFixed(2)}</span>`
            : `$${esc(p.p)}`;
        // Aunque no sea un "par" con precio total (pD/pH), muchas alianzas se
        // fotografían mostrando las dos piezas aunque se vendan como una sola a
        // precio unisex — se avisa igual para no confundir al cliente.
        return `${base}${(p.par || (p.avisoPieza && ES_PAR.test(p.n)))?`<span style="display:block;font-size:10px;font-weight:500;color:#7c3aed;margin-top:2px;">Precio por pieza</span>`:""}`;
    }

    function showExpired(nombre, wa){
        document.getElementById("app").innerHTML=`
            <header><img class="logo" src="/images/logo.webp" alt="VEREX"></header>
            <div class="expired">
                <div class="exp-icon">⏰</div>
                <h2>Este catálogo ya venció</h2>
                <p>Hola${nombre?' <strong>'+esc(nombre)+'</strong>':''}, este catálogo ya no está disponible.<br>
                Contáctanos para ver el inventario actualizado.</p>
                <a href="https://wa.me/${esc(normalizarWA(wa))}" class="wa-btn">📱 Contactar por WhatsApp</a>
            </div>
            <footer>VEREX · La expresión de tu mejor versión</footer>`;
    }

    // Normaliza el teléfono a formato internacional que wa.me realmente
    // reconoce — el número guardado a veces se guardó local (8 dígitos, sin
    // "503"), lo que rompe el link silenciosamente: el cliente cree que
    // envió el mensaje, pero nunca le llega nada al afiliado/VEREX.
    function normalizarWA(numero){
        const solo = String(numero||"").replace(/\D/g,"");
        if (!solo) return "";
        if (solo.length === 8) return "503" + solo;      // local SV sin código de país
        if (solo.startsWith("503") && solo.length === 11) return solo;
        return solo;
    }

    function render(data){
        // Acero 316L es la línea secundaria/económica: se manda al final para que
        // la plata (línea principal) sea lo primero que ve el cliente. El sort de
        // JS es estable, así que dentro de cada grupo se respeta el orden con el
        // que se armó el catálogo. Se ordena una copia para no alterar el payload
        // original, y acá — en el render — para que aplique también a los links
        // que ya se compartieron, no solo a los catálogos nuevos.
        const esAceroProd = p => /acero/i.test(p.m || "") || /acero/i.test(p.n || "");
        _prods = [...(data.prods || [])]
            .sort((a, b) => (esAceroProd(a) ? 1 : 0) - (esAceroProd(b) ? 1 : 0));
        _waNum = normalizarWA(data.wa);
        _descPct = Math.min(90, Math.max(0, parseInt(data.descPct) || 0));
        _promo2x50 = !!data.promo2x50;
        // Compatibilidad: links viejos guardaron solo "promo2x50:true" sin el
        // objeto general — se traduce al nuevo formato para que sigan funcionando.
        _promoCarrito = data.promoCarrito || (_promo2x50 ? { tipo: "2x50" } : null);
        _envioGratisDesde = parseFloat(data.envioGratisDesde) || 0;
        _regaloSorpresa = (data.regaloSorpresa && data.regaloSorpresa.monto > 0) ? data.regaloSorpresa : null;
        _afiliadoCodigo = data.afiliadoCodigo || "";

        const exp    = new Date(data.expiry);
        const expStr = exp.toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});
        const nb     = data.nombre||"";
        const talla  = data.talla||"";

        let subParts=[];
        if(nb)    subParts.push(`${data.afiliado?'Distribuidor:':'Para:'} <strong>${esc(nb)}</strong>`);
        if(talla) subParts.push(`Talla: <strong>${esc(talla)}</strong>`);
        const subHTML = subParts.join(" &nbsp;·&nbsp; ");

        const szChip = sz => `<span style="padding:2px 7px;background:#e8f4fd;border-radius:5px;font-size:10px;font-weight:700;color:#0277bd;">T${sz}</span>`;
        const cards = _prods.map((p,i)=>{
            let sizesHtml = "";
            if (p.cat === "AN") {
                if (p.par && (p.sizesD?.length || p.sizesH?.length)) {
                    sizesHtml = `<div style="margin:5px 0;font-size:10px;line-height:1.8;">
                        ${p.sizesD?.length ? `<div><span style="color:#9333ea;font-weight:700;">Dama:</span> ${p.sizesD.map(szChip).join(" ")}</div>` : ""}
                        ${p.sizesH?.length ? `<div><span style="color:#2563eb;font-weight:700;">Caballero:</span> ${p.sizesH.map(szChip).join(" ")}</div>` : ""}
                    </div>`;
                } else if (p.sizes?.length) {
                    sizesHtml = `<div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:5px 0;">${p.sizes.map(szChip).join("")}</div>`;
                }
            }
            return `
            <div class="card" data-idx="${i}" data-cod="${esc(p.c||'')}">
                <div class="card-img-wrap">
                    <span class="card-agotado-badge">AGOTADO</span>
                    ${p.i
                        ?`<img class="card-img" src="${esc(p.i)}" alt="${esc(p.n)}" loading="lazy" style="cursor:zoom-in;" onclick="abrirFotoZoom('${esc(p.i)}')" onerror="this.outerHTML='<div class=\'card-img-ph\'>💍</div>'">`
                        :`<div class="card-img-ph">💍</div>`}
                </div>
                <div class="card-body">
                    <div class="card-name">${esc(p.n)}</div>
                    ${p.m?`<div class="card-material ${claseMaterial(p.m)}">${esc(p.m)}</div>`:''}
                    ${p.c?`<div style="font-size:9px;color:#9ca3af;font-weight:600;margin-top:-3px;margin-bottom:4px;">Ref: ${esc(p.c)}</div>`:''}
                    ${sizesHtml}
                    ${p.ne?`<div class="card-ne">♦ ${esc(p.ne)}</div>`:''}
                    <div class="card-price" id="price-${i}">${renderPrecioHtml(p)}</div>
                    ${p.nota?`<div class="card-nota">${esc(p.nota)}</div>`:''}
                </div>
                <div class="card-footer">
                    <button class="wa-order" onclick="elegirTalla(${i},'wa',this)"><span class="wa-main">✦ ¡Hazlo tuyo!</span><span class="wa-sub">Presiona aquí para ordenar</span><span class="wa-shine"></span></button>
                    <button class="cart-add" onclick="elegirTalla(${i},'carrito')" title="Agregar al carrito">🛒<span class="cart-label">2+ piezas</span></button>
                </div>
            </div>`;
        }).join("");

        const b = data.banner;
        const bannerHTML = b?.txt ? `
            <div style="background:${esc(b.color||'#ef4444')};color:#fff;text-align:center;padding:14px 20px;">
                <div style="font-size:16px;font-weight:900;letter-spacing:.5px;line-height:1.3;">${esc(b.txt)}</div>
                ${b.sub?`<div style="font-size:12px;font-weight:500;margin-top:4px;opacity:.9;">${esc(b.sub)}</div>`:''}
            </div>` : '';
        // Banner de promo de carrito — un solo diseño dorado reutilizado para
        // las 4 variantes, con título/subtítulo según el tipo activo. El
        // ícono ocupa el alto completo del banner (flex) para llamar más la
        // atención que un emoji suelto dentro del texto.
        const _promoCopy = (() => {
            if(!_promoCarrito) return null;
            if(_promoCarrito.tipo === "2x50") return { titulo: "2do producto al 50% de descuento", sub: "Se aplica automático a la pieza de igual o menor precio — agrega 2 o más al carrito" };
            if(_promoCarrito.tipo === "3x2")  return { titulo: "3x2 — la 3ra pieza (más barata) es GRATIS", sub: "Agrega 3 o más piezas al carrito y el descuento se aplica automático" };
            if(_promoCarrito.tipo === "montoFijo"){
                const min = parseFloat(_promoCarrito.minimoCompra) || 0;
                return {
                    titulo: `$${(parseFloat(_promoCarrito.montoFijo)||0).toFixed(2)} de descuento en tu pedido`,
                    sub: min > 0 ? `Por cada $${min.toFixed(2)} que gastes — se repite y se aplica automático` : "Se aplica automático al agregar productos al carrito"
                };
            }
            if(_promoCarrito.tipo === "escalonado"){
                const max = [...(_promoCarrito.escalones||[])].sort((a,b)=>b.pct-a.pct)[0];
                return { titulo: max ? `Hasta ${max.pct}% de descuento por cantidad` : "Descuento por cantidad", sub: "Entre más piezas agregues al carrito, más grande el descuento" };
            }
            return null;
        })();
        const promo2x50HTML = _promoCopy ? `
            <div style="background:linear-gradient(135deg,#8a6a1f 0%,#e8c766 22%,#fff3c4 42%,#C9A84C 58%,#8a6a1f 78%,#f4dd8a 100%);background-size:200% 200%;animation:doradoShine 3.5s ease-in-out infinite;color:#3a2a05;text-align:center;padding:12px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);position:relative;overflow:hidden;">
                <div style="display:flex;align-items:center;justify-content:center;gap:8px;position:relative;">
                    <span id="promo2x50-icon" onclick="_abrirRegaloPromo(this)" title="Toca para abrir">🎁</span>
                    <span style="font-size:15px;font-weight:900;letter-spacing:.3px;text-shadow:0 1px 0 rgba(255,255,255,0.35);">${esc(_promoCopy.titulo)}</span>
                </div>
                <div style="font-size:11.5px;font-weight:600;margin-top:2px;opacity:.85;">${esc(_promoCopy.sub)}</div>
            </div>` : '';
        // Envío gratis / regalo sorpresa — avisos independientes, se pueden
        // combinar entre sí y con la promo de arriba (son incentivos, no
        // afectan el cálculo del precio como las 4 promos de carrito).
        const envioGratisHTML = _envioGratisDesde > 0 ? `
            <div style="background:#166534;color:#fff;text-align:center;padding:8px 16px;font-size:12.5px;font-weight:700;">🚚 Envío GRATIS en pedidos desde $${_envioGratisDesde.toFixed(2)}</div>` : '';
        const regaloSorpresaHTML = _regaloSorpresa ? `
            <div style="background:#5b21b6;color:#fff;text-align:center;padding:8px 16px;font-size:12.5px;font-weight:700;">🎁 Regalo sorpresa en pedidos desde $${_regaloSorpresa.monto.toFixed(2)}: ${esc(_regaloSorpresa.texto)}</div>` : '';

        // Filtro de talla — solo se arma si el catálogo tiene al menos un
        // anillo con tallas registradas; junta las tallas de todos los
        // anillos (sencillos y pares dama/caballero) sin repetir.
        const tallasSet = new Set();
        _prods.forEach(p => {
            if (p.cat !== "AN") return;
            (p.sizes||[]).forEach(s => tallasSet.add(s));
            (p.sizesD||[]).forEach(s => tallasSet.add(s));
            (p.sizesH||[]).forEach(s => tallasSet.add(s));
        });
        const tallasOrdenadas = [...tallasSet].sort((a,b) => parseFloat(a)-parseFloat(b));
        const filtroTallaHTML = tallasOrdenadas.length ? `
            <div id="filtro-talla-bar">
                <span class="flt-lbl">💍 Talla de anillo:</span>
                ${tallasOrdenadas.map(t => `<button class="chip-talla" data-talla="${esc(t)}" onclick="toggleFiltroTalla('${esc(t)}',this)">T${esc(t)}</button>`).join("")}
                <button class="chip-talla-limpiar" onclick="limpiarFiltroTalla()">✕ Todas</button>
            </div>` : '';

        document.getElementById("app").innerHTML=`
            <header><img class="logo" src="/images/logo.webp" alt="VEREX"></header>
            ${bannerHTML}
            ${promo2x50HTML}
            ${envioGratisHTML}
            ${regaloSorpresaHTML}
            <div class="info-bar">
                ${subHTML?`<div>${subHTML}</div>`:''}
                <div class="validez">⏰ Válido hasta: ${expStr}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;margin:10px 12px 2px;padding:9px 12px;font-size:11.5px;color:#78350f;line-height:1.4;">
                <span style="font-size:18px;flex-shrink:0;">🛒</span>
                <span>¿Quieres pedir <strong>2 o más piezas?</strong> Usa el carrito para juntarlas y hacer un solo pedido al final.</span>
            </div>
            ${filtroTallaHTML}
            <div class="grid">${cards}</div>
            <footer>VEREX · La expresión de tu mejor versión</footer>`;

        // Primer vistazo: la lluvia de confeti cae UNA vez, sin que el
        // cliente tenga que tocar nada, para que la promo se note de
        // inmediato. El regalo también se abre en simultáneo — después se
        // puede volver a tocar para repetir solo el efecto chico.
        if(_promoCarrito){
            setTimeout(() => {
                _lluviaConfettiPromo();
                const icono = document.getElementById("promo2x50-icon");
                if(icono) _abrirRegaloPromo(icono);
            }, 900);
        }
    }

    /* ── Filtro de talla (anillos) ── */
    let _filtroTallas = new Set();

    function toggleFiltroTalla(talla, btn){
        if(_filtroTallas.has(talla)){ _filtroTallas.delete(talla); btn.classList.remove("activa"); }
        else { _filtroTallas.add(talla); btn.classList.add("activa"); }
        aplicarFiltroTalla();
    }

    function limpiarFiltroTalla(){
        _filtroTallas.clear();
        document.querySelectorAll(".chip-talla").forEach(b => b.classList.remove("activa"));
        aplicarFiltroTalla();
    }

    // Solo oculta/muestra anillos — el resto de categorías (aretes, pulseras,
    // etc.) siempre se quedan visibles, el filtro de talla no les aplica.
    // Usa una clase (no style.display directo) para no chocar con el
    // display:none que ya pone actualizarDisponibilidad() en lo agotado.
    function aplicarFiltroTalla(){
        document.querySelectorAll(".card").forEach(card => {
            const idx = parseInt(card.dataset.idx);
            const p = _prods[idx];
            if(!p || p.cat !== "AN" || _filtroTallas.size === 0){ card.classList.remove("oculto-talla"); return; }
            const tallas = [...(p.sizes||[]), ...(p.sizesD||[]), ...(p.sizesH||[])];
            const coincide = tallas.some(t => _filtroTallas.has(t));
            card.classList.toggle("oculto-talla", !coincide);
        });
    }

    /* ── Selector de talla ── */

    function miniToast(msg){
        const t = document.getElementById("mini-toast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(window._miniToastTimer);
        window._miniToastTimer = setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    function elegirTalla(i, modo, btnEl){
        _szModo = modo || "wa";
        // Brillo plateado al tocar el botón dorado — se re-dispara quitando y
        // volviendo a poner la clase (si no, el navegador no repite la misma
        // animación en clics seguidos).
        if(btnEl && btnEl.classList.contains("wa-order")){
            btnEl.classList.remove("brillando");
            void btnEl.offsetWidth;
            btnEl.classList.add("brillando");
        }
        const p = _prods[i];
        if(!p) return;
        if(p._agotado){ alert("Este producto ya no está disponible — el stock se agotó."); return; }

        const esPareja = ES_PAR.test(p.n) || p.par;

        // Nombre + teléfono obligatorios SIEMPRE (cliente y afiliado) cuando se
        // manda directo por WhatsApp — un mismo link de catálogo se puede
        // compartir por varios canales a varios clientes distintos, y sin estos
        // datos no hay forma de saber quién pidió qué cuando llega el mensaje.
        // En modo carrito se piden UNA vez al enviar todo el pedido junto (en
        // el cajón del carrito), no por cada producto que se va agregando.
        _szTel = ""; _szNombreCliente = ""; _szDireccion = "";
        const telWrap = document.getElementById("sz-tel-wrap");
        const telInput = document.getElementById("sz-tel");
        const nombreInput = document.getElementById("sz-nombre");
        const direccionInput = document.getElementById("sz-direccion");
        if(telWrap){ telWrap.style.display = (_szModo === "wa") ? "block" : "none"; }
        if(telInput){ telInput.value = ""; }
        if(nombreInput){ nombreInput.value = ""; }
        if(direccionInput){ direccionInput.value = ""; }

        // Argollas/pares/tríos: si hay tallas registradas para dama y/o
        // caballero, se eligen con botones igual que un anillo individual.
        // Si no hay info de tallas, se pide el teléfono (si aplica) y se
        // manda por WhatsApp con el mensaje de siempre.
        if(esPareja){
            const availD = p.sizesD?.length ? p.sizesD : null;
            const availH = p.sizesH?.length ? p.sizesH : null;

            if(!availD && !availH){
                _szIdx=i; _szD="N/A"; _szH="N/A"; _szParMode=true; _szNoTalla=true;
                document.getElementById("sz-title").textContent = p.n;
                document.getElementById("sz-sub").textContent   = "¿Qué tallas necesita para dama y caballero?";
                document.getElementById("sz-sec-d").style.display = "none";
                document.getElementById("sz-sec-h").style.display = "none";
                actualizarBotonSz();
                document.getElementById("sz-overlay").classList.add("open");
                return;
            }

            _szIdx=i; _szD=""; _szH=""; _szParMode=true; _szNoTalla=false;

            document.getElementById("sz-title").textContent = p.n;
            document.getElementById("sz-sub").textContent   = "¿Qué tallas necesitas?";

            if(availD){
                document.getElementById("sz-sec-d").style.display = "";
                document.getElementById("sz-lbl-d").textContent = "Talla dama";
                document.getElementById("sz-grid-d").innerHTML = availD.map(sz=>
                    `<button class="sz-btn" onclick="selSz('D','${sz}',this)">T${sz}</button>`
                ).join("");
            } else {
                document.getElementById("sz-sec-d").style.display = "none";
                _szD = "N/A";
            }

            if(availH){
                document.getElementById("sz-sec-h").style.display = "";
                document.getElementById("sz-grid-h").innerHTML = availH.map(sz=>
                    `<button class="sz-btn" onclick="selSz('H','${sz}',this)">T${sz}</button>`
                ).join("");
            } else {
                document.getElementById("sz-sec-h").style.display = "none";
                _szH = "N/A";
            }

            actualizarBotonSz();
            document.getElementById("sz-overlay").classList.add("open");
            return;
        }

        if(p.cat && p.cat !== "AN"){
            _szIdx=i; _szD="N/A"; _szH="N/A"; _szParMode=false; _szNoTalla=true;
            document.getElementById("sz-title").textContent = p.n;
            document.getElementById("sz-sub").textContent   = "Confirma tu pedido";
            document.getElementById("sz-sec-d").style.display = "none";
            document.getElementById("sz-sec-h").style.display = "none";
            actualizarBotonSz();
            document.getElementById("sz-overlay").classList.add("open");
            return;
        }

        _szIdx=i; _szD=""; _szH=""; _szParMode=false; _szNoTalla=false;

        const availD = (p.sizes?.length ? p.sizes : SIZES);

        document.getElementById("sz-title").textContent = p.n;
        document.getElementById("sz-sub").textContent   = "¿Qué talla necesitas?";
        document.getElementById("sz-sec-d").style.display = "";
        document.getElementById("sz-lbl-d").textContent = "Tu talla";
        document.getElementById("sz-sec-h").style.display = "none";

        document.getElementById("sz-grid-d").innerHTML = availD.map(sz=>
            `<button class="sz-btn" onclick="selSz('D','${sz}',this)">T${sz}</button>`
        ).join("");

        actualizarBotonSz();
        document.getElementById("sz-overlay").classList.add("open");
    }

    function selSz(gen, sz, el){
        if(gen === "D"){
            document.querySelectorAll("#sz-grid-d .sz-btn").forEach(b=>b.classList.remove("sel-d"));
            el.classList.add("sel-d");
            _szD = sz;
        } else {
            document.querySelectorAll("#sz-grid-h .sz-btn").forEach(b=>b.classList.remove("sel-h"));
            el.classList.add("sel-h");
            _szH = sz;
        }
        actualizarBotonSz();
    }

    // Habilita el botón de confirmar solo cuando ya hay talla(s) elegida(s)
    // Y, si el catálogo es de afiliado Y se va a enviar YA por WhatsApp, el
    // teléfono tiene algo escrito (en modo carrito el teléfono se pide luego,
    // una sola vez, al enviar todo el pedido junto).
    function actualizarBotonSz(){
        const tallaLista = _szNoTalla ? true : (_szParMode ? (_szD && _szH) : !!_szD);
        const telInput = document.getElementById("sz-tel");
        const nombreInput = document.getElementById("sz-nombre");
        const direccionInput = document.getElementById("sz-direccion");
        // Nombre, teléfono y dirección se exigen siempre que se vaya a mandar
        // YA por WhatsApp (cliente o afiliado) — en modo carrito no aplica
        // aquí, se piden una sola vez al final en el cajón del carrito.
        const requiereDatos = _szModo === "wa";
        const telOk = requiereDatos ? !!(telInput && telInput.value.trim().length >= 4) : true;
        const nombreOk = requiereDatos ? !!(nombreInput && nombreInput.value.trim().length >= 2) : true;
        const direccionOk = requiereDatos ? !!(direccionInput && direccionInput.value.trim().length >= 8) : true;
        _szTel = telInput ? telInput.value.trim() : "";
        _szNombreCliente = nombreInput ? nombreInput.value.trim() : "";
        _szDireccion = direccionInput ? direccionInput.value.trim() : "";
        const listo = tallaLista && telOk && nombreOk && direccionOk;
        const btn = document.getElementById("sz-confirm");
        btn.disabled = !listo;
        btn.style.opacity = listo ? "1" : ".5";
        btn.textContent = _szModo === "carrito" ? "🛒 Agregar al carrito" : "💬 Enviar por WhatsApp";
    }

    // Arma un texto corto de talla y el precio unitario ya con descuento
    // aplicado, reutilizando el mismo estado (p, _szD/_szH/_szParMode/
    // _szNoTalla) que ya calcula confirmarTalla() para el mensaje directo.
    function _labelYPrecioCarrito(p){
        if(_szParMode && _szNoTalla){
            const precio = (p.pD && p.pH) ? precioFinal(parseFloat(p.pD)) + precioFinal(parseFloat(p.pH)) : precioFinal(p.p);
            return { label: "Tallas a confirmar (dama/caballero)", precio };
        }
        if(_szNoTalla){
            return { label: "", precio: precioFinal(p.p) };
        }
        if(_szParMode){
            const precio = (p.pD != null && p.pH != null) ? precioFinal(parseFloat(p.pD) + parseFloat(p.pH)) : precioFinal(p.p);
            const partes = [
                _szD && _szD !== "N/A" ? `Dama T${_szD}` : '',
                _szH && _szH !== "N/A" ? `Caballero T${_szH}` : ''
            ].filter(Boolean);
            return { label: partes.join(" / "), precio };
        }
        return { label: `Talla T${_szD}`, precio: precioFinal(p.p) };
    }

    function confirmarTalla(){
        const p = _prods[_szIdx];

        if(_szModo === "carrito"){
            const { label, precio } = _labelYPrecioCarrito(p);
            agregarACarrito(p, label, precio);
            cerrarTallas();
            miniToast("✅ Agregado al carrito");
            return;
        }

        let msg;
        const telLinea = (_szNombreCliente || _szTel || _szDireccion)
            ? `\n\nMis datos:${_szNombreCliente?`\nNombre: ${_szNombreCliente}`:''}${_szTel?`\nWhatsApp: ${_szTel}`:''}${_szDireccion?`\nDirección de envío: ${_szDireccion}`:''}`
            : '';

        if(_szParMode && _szNoTalla){
            const precioInfo = (p.pD && p.pH && p.pD !== p.pH)
                ? `Precio dama: $${precioFinal(p.pD).toFixed(2)} por pieza\nPrecio caballero: $${precioFinal(p.pH).toFixed(2)} por pieza`
                : `Precio individual: $${precioFinal(p.p).toFixed(2)} por pieza`;
            const sizesInfo = [
                p.sizesD?.length ? `Dama: ${p.sizesD.map(s=>'T'+s).join(', ')}` : '',
                p.sizesH?.length ? `Caballero: ${p.sizesH.map(s=>'T'+s).join(', ')}` : ''
            ].filter(Boolean).join('\n');
            msg = `Hola, me interesan estas argollas del catálogo VEREX:\n\n${p.n}\n${precioInfo}${sizesInfo ? `\n\nTallas disponibles:\n${sizesInfo}` : ''}\n\n¿Qué tallas necesita para dama y caballero?${telLinea}`;
        } else if(_szNoTalla){
            msg = `Hola, me interesa este producto del catálogo VEREX:\n\n${p.n}\nPrecio: $${precioFinal(p.p).toFixed(2)}${telLinea}`;
        } else if(_szParMode){
            const precioInfo = (p.pD != null && p.pH != null)
                ? `Precio total: $${precioFinal(parseFloat(p.pD)+parseFloat(p.pH)).toFixed(2)}`
                : `Precio: $${precioFinal(p.p).toFixed(2)}`;
            const tallasInfo = [
                _szD && _szD !== "N/A" ? `Talla dama: T${_szD}` : '',
                _szH && _szH !== "N/A" ? `Talla caballero: T${_szH}` : ''
            ].filter(Boolean).join('\n');
            msg = `Hola, me interesa este producto del catálogo VEREX:\n\n${p.n}\n${precioInfo}\n${tallasInfo}${telLinea}`;
        } else {
            msg = `Hola, me interesa este producto del catálogo VEREX:\n\n${p.n}\nPrecio: $${precioFinal(p.p).toFixed(2)}\nTalla: T${_szD}${telLinea}`;
        }
        registrarLead(p, _szTel, _szNombreCliente, _szDireccion);
        cerrarTallas();
        window.open(`https://wa.me/${_waNum}?text=${encodeURIComponent(msg)}`,"_blank");
    }

    function cerrarTallas(){
        document.getElementById("sz-overlay").classList.remove("open");
    }

    /* ── Carrito multi-producto ── */
    // Discreto a propósito: no cambia el flujo de "¡Hazlo tuyo!" (que sigue
    // mandando un WhatsApp inmediato), solo agrega una alternativa para
    // juntar varios productos y mandarlos en un solo mensaje al final.

    // Regalo del banner promo: al tocarlo (o solo, un segundo después de
    // cargar la página) deja de bambolear, se agranda, y lanza confeti de
    // colores dorados desde su posición — puramente decorativo, se puede
    // volver a tocar para repetir.
    function _abrirRegaloPromo(el){
        if(!el) return;
        el.classList.add("abierto");
        el.textContent = "🎉";
        setTimeout(() => { el.classList.remove("abierto"); el.textContent = "🎁"; }, 700);

        const contenedor = el.closest("div[style*='position:relative']") || el.parentElement;
        const colores = ["#C9A84C","#fff3c4","#8a6a1f","#fff","#e8c766"];
        for(let i=0;i<22;i++){
            const bit = document.createElement("span");
            bit.className = "confetti-bit";
            bit.style.background = colores[i % colores.length];
            bit.style.left = (45 + Math.random()*10) + "%";
            bit.style.transform = `translateX(${(Math.random()-0.5)*140}px)`;
            bit.style.animationDelay = (Math.random()*120) + "ms";
            bit.style.animationDuration = (700 + Math.random()*400) + "ms";
            contenedor.appendChild(bit);
            setTimeout(() => bit.remove(), 1300);
        }
    }

    // Lluvia de confeti a pantalla completa — anuncia la promo UNA sola vez
    // al cargar la página, cayendo desde arriba de todo el viewport (no solo
    // cerca del ícono). Se dispara aparte de _abrirRegaloPromo, que sigue
    // siendo el efecto chico y repetible al tocar el regalo.
    function _lluviaConfettiPromo(){
        const wrap = document.createElement("div");
        wrap.id = "confetti-rain-wrap";
        document.body.appendChild(wrap);
        const colores = ["#C9A84C","#fff3c4","#8a6a1f","#fff","#e8c766","#7c3aed"];
        const formas = ["50%", "2px"]; // algunas redondas, algunas cuadradas
        for(let i=0;i<70;i++){
            const bit = document.createElement("span");
            bit.className = "confetti-rain-bit";
            const w = 6 + Math.random()*5;
            bit.style.width = w + "px";
            bit.style.height = (w*1.5) + "px";
            bit.style.borderRadius = formas[i % 2];
            bit.style.background = colores[i % colores.length];
            bit.style.left = Math.random()*100 + "vw";
            bit.style.animationDuration = (1800 + Math.random()*1400) + "ms";
            bit.style.animationDelay = (Math.random()*900) + "ms";
            wrap.appendChild(bit);
        }
        setTimeout(() => wrap.remove(), 3500);
    }

    function guardarCarrito(){
        try { sessionStorage.setItem("verex-carrito", JSON.stringify(_carrito)); } catch(_) {}
    }

    // Envío gratis y regalo sorpresa son incentivos "de progreso" — no
    // cambian el precio como las promos de arriba, solo motivan a agregar
    // una pieza más mostrando cuánto falta para desbloquearlos.
    function _renderProgresoIncentivos(totalActual){
        const cont = document.getElementById("cart-incentivos");
        if(!cont) return;
        const bloques = [];
        if(_envioGratisDesde > 0){
            if(totalActual >= _envioGratisDesde){
                bloques.push(`<div style="background:#dcfce7;color:#166534;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;margin-top:8px;">🚚 ¡Envío GRATIS desbloqueado!</div>`);
            } else {
                const falta = _envioGratisDesde - totalActual;
                bloques.push(`<div style="background:#fef9c3;color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;">🚚 Te faltan $${falta.toFixed(2)} para envío GRATIS</div>`);
            }
        }
        if(_regaloSorpresa){
            if(totalActual >= _regaloSorpresa.monto){
                bloques.push(`<div style="background:#ede9fe;color:#5b21b6;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;margin-top:8px;">🎁 ¡Incluye regalo sorpresa: ${esc(_regaloSorpresa.texto)}!</div>`);
            } else {
                const falta = _regaloSorpresa.monto - totalActual;
                bloques.push(`<div style="background:#fef9c3;color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;">🎁 Te faltan $${falta.toFixed(2)} para un regalo sorpresa</div>`);
            }
        }
        // Monto fijo con mínimo de compra: se repite por tramos, así que
        // siempre avisa cuánto falta para el PRÓXIMO tramo (no solo el primero).
        if(_promoCarrito?.tipo === "montoFijo"){
            const minimo = parseFloat(_promoCarrito.minimoCompra) || 0;
            const base = parseFloat(_promoCarrito.montoFijo) || 0;
            if(minimo > 0){
                const tramosActuales = Math.floor(totalActual / minimo);
                const faltaProximo = (minimo * (tramosActuales + 1)) - totalActual;
                bloques.push(`<div style="background:#fef9c3;color:#854d0e;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;">🎁 Te faltan $${faltaProximo.toFixed(2)} para ${tramosActuales > 0 ? "otro" : "el"} descuento de $${base.toFixed(2)}</div>`);
            }
        }
        cont.innerHTML = bloques.join("");
    }

    // Calcula el total del carrito aplicando la promo activa (si hay una).
    // Las 4 variantes comparten la misma base: expandir el carrito a
    // unidades individuales (respetando qty>1) y ordenarlas de mayor a
    // menor precio — así el descuento siempre recae en la(s) pieza(s) más
    // barata(s), protegiendo el margen sin importar en qué orden el
    // cliente las haya agregado.
    function _calcularPromoCarrito(){
        if(!_promoCarrito || !_promoCarrito.tipo) return null;
        const unidades = [];
        _carrito.forEach(it => { for(let i=0;i<it.qty;i++) unidades.push(it.precioUnit); });
        if(!unidades.length) return null;
        unidades.sort((a,b) => b-a);
        const subtotal = unidades.reduce((s,p) => s+p, 0);

        if(_promoCarrito.tipo === "2x50"){
            if(unidades.length < 2) return null;
            let total = 0, descuento = 0;
            unidades.forEach((p, idx) => { if(idx % 2 === 1){ total += p*0.5; descuento += p*0.5; } else total += p; });
            return { total, descuento, etiqueta: "🎁 Promo 2do al 50%" };
        }
        if(_promoCarrito.tipo === "3x2"){
            if(unidades.length < 3) return null;
            let total = 0, descuento = 0;
            unidades.forEach((p, idx) => { if(idx % 3 === 2){ descuento += p; } else total += p; });
            return { total, descuento, etiqueta: "🎁 Promo 3x2 (la más barata gratis)" };
        }
        if(_promoCarrito.tipo === "montoFijo"){
            const base = parseFloat(_promoCarrito.montoFijo) || 0;
            const minimo = parseFloat(_promoCarrito.minimoCompra) || 0;
            let monto;
            if(minimo > 0){
                // Se repite por cada tramo completo — $10 por cada $50 gastados:
                // $100 = 2 tramos = $20 off, $150 = 3 tramos = $30 off.
                const tramos = Math.floor(subtotal / minimo);
                if(tramos < 1) return null;
                monto = Math.min(base * tramos, subtotal);
                if(monto <= 0) return null;
                return { total: subtotal - monto, descuento: monto, etiqueta: `🎁 Descuento de $${monto.toFixed(2)} (${tramos}× $${base.toFixed(2)} por cada $${minimo.toFixed(2)})` };
            }
            monto = Math.min(base, subtotal);
            if(monto <= 0) return null;
            return { total: subtotal - monto, descuento: monto, etiqueta: `🎁 Descuento de $${monto.toFixed(2)}` };
        }
        if(_promoCarrito.tipo === "escalonado"){
            const escalones = [...(_promoCarrito.escalones || [])].sort((a,b) => b.minCant - a.minCant);
            const tier = escalones.find(e => unidades.length >= e.minCant);
            if(!tier) return null;
            const descuento = subtotal * (tier.pct/100);
            return { total: subtotal - descuento, descuento, etiqueta: `🎁 ${tier.pct}% por llevar ${unidades.length} piezas` };
        }
        return null;
    }

    function renderCarritoFab(){
        const total = _carrito.reduce((s, it) => s + it.qty, 0);
        document.getElementById("cart-fab-badge").textContent = total;
        document.getElementById("cart-fab").classList.toggle("show", total > 0);
    }

    function agregarACarrito(p, tallaLabel, precioUnit){
        const key = (p.c || p.n) + "|" + tallaLabel;
        const existente = _carrito.find(it => it.key === key);
        if(existente) existente.qty++;
        else _carrito.push({ key, codigo: p.c || "", nombre: p.n, tallaLabel, precioUnit, qty: 1 });
        guardarCarrito();
        renderCarritoFab();
    }

    function renderCarritoLista(){
        const cont = document.getElementById("cart-list");
        if(!_carrito.length){
            cont.innerHTML = '<p style="text-align:center;color:#999;font-size:13px;padding:20px 0;">Tu carrito está vacío.</p>';
        } else {
            cont.innerHTML = _carrito.map(it => `
                <div class="cart-item">
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:13px;font-weight:700;color:#111;">${esc(it.nombre)}</div>
                        ${it.tallaLabel ? `<div style="font-size:11px;color:#7c3aed;">${esc(it.tallaLabel)}</div>` : ''}
                        <div style="font-size:12px;color:#666;">$${it.precioUnit.toFixed(2)} c/u</div>
                    </div>
                    <button class="cart-item-qtybtn" onclick="cambiarQtyCarrito('${esc(it.key)}',-1)">−</button>
                    <span style="font-weight:700;min-width:16px;text-align:center;">${it.qty}</span>
                    <button class="cart-item-qtybtn" onclick="cambiarQtyCarrito('${esc(it.key)}',1)">+</button>
                    <div style="font-size:13px;font-weight:800;color:#111;min-width:55px;text-align:right;">$${(it.precioUnit*it.qty).toFixed(2)}</div>
                </div>`).join("");
        }
        const subtotal = _carrito.reduce((s, it) => s + it.precioUnit * it.qty, 0);
        const promo = _calcularPromoCarrito();
        const totalEl = document.getElementById("cart-total");
        const promoLineaEl = document.getElementById("cart-promo-linea");
        if(promo){
            totalEl.innerHTML = `<span style="text-decoration:line-through;color:#999;font-size:13px;font-weight:600;">$${subtotal.toFixed(2)}</span> $${promo.total.toFixed(2)}`;
            if(promoLineaEl) promoLineaEl.textContent = `${promo.etiqueta}: -$${promo.descuento.toFixed(2)}`;
            if(promoLineaEl) promoLineaEl.style.display = "block";
        } else {
            totalEl.textContent = "$" + subtotal.toFixed(2);
            if(promoLineaEl) promoLineaEl.style.display = "none";
        }
        _renderProgresoIncentivos(subtotal);
    }

    function cambiarQtyCarrito(key, delta){
        const it = _carrito.find(x => x.key === key);
        if(!it) return;
        it.qty += delta;
        if(it.qty <= 0) _carrito = _carrito.filter(x => x.key !== key);
        guardarCarrito();
        renderCarritoFab();
        renderCarritoLista();
        actualizarBotonCarrito();
    }

    // Nombre y teléfono se piden SIEMPRE al enviar el carrito (cliente o
    // afiliado) — un mismo link se puede compartir por varios canales a
    // varios clientes distintos, y sin estos datos no se sabe quién pidió.
    function actualizarBotonCarrito(){
        const telInput = document.getElementById("cart-tel");
        const nombreInput = document.getElementById("cart-nombre");
        const direccionInput = document.getElementById("cart-direccion");
        const telOk = !!(telInput && telInput.value.trim().length >= 4);
        const nombreOk = !!(nombreInput && nombreInput.value.trim().length >= 2);
        const direccionOk = !!(direccionInput && direccionInput.value.trim().length >= 8);
        const btn = document.getElementById("cart-confirm");
        const listo = _carrito.length > 0 && telOk && nombreOk && direccionOk;
        btn.disabled = !listo;
        btn.style.opacity = listo ? "1" : ".5";
    }

    function abrirCarrito(){
        renderCarritoLista();
        actualizarBotonCarrito();
        document.getElementById("cart-overlay").classList.add("open");

    function enviarCarritoWhatsApp(){
        if(!_carrito.length) return;
        const telInput = document.getElementById("cart-tel");
        const nombreInput = document.getElementById("cart-nombre");
        const direccionInput = document.getElementById("cart-direccion");
        const tel = telInput ? telInput.value.trim() : "";
        const nombreCliente = nombreInput ? nombreInput.value.trim() : "";
        const direccionCliente = direccionInput ? direccionInput.value.trim() : "";
        if(tel.length < 4 || nombreCliente.length < 2 || direccionCliente.length < 8) return;

        const lineas = _carrito.map((it, idx) =>
            `${idx+1}. ${it.nombre}${it.tallaLabel ? ` (${it.tallaLabel})` : ''}${it.qty > 1 ? ` x${it.qty}` : ''} — $${(it.precioUnit*it.qty).toFixed(2)}`
        );
        const subtotal = _carrito.reduce((s, it) => s + it.precioUnit * it.qty, 0);
        const promo = _calcularPromoCarrito();
        const totalFinal = promo ? promo.total : subtotal;
        const totalLinea = promo
            ? `Subtotal: $${subtotal.toFixed(2)}\n${promo.etiqueta}: -$${promo.descuento.toFixed(2)}\nTotal: $${promo.total.toFixed(2)}`
            : `Total: $${subtotal.toFixed(2)}`;
        const incentivosLinea = [
            (_envioGratisDesde > 0 && totalFinal >= _envioGratisDesde) ? "🚚 Envío GRATIS aplicado" : "",
            (_regaloSorpresa && totalFinal >= _regaloSorpresa.monto) ? `🎁 Incluye regalo sorpresa: ${_regaloSorpresa.texto}` : ""
        ].filter(Boolean).join("\n");
        const msg = `Hola, soy ${nombreCliente}. Quiero pedir estos productos del catálogo VEREX:\n\n${lineas.join("\n")}\n\n${totalLinea}${incentivosLinea ? "\n" + incentivosLinea : ""}\n\nMi WhatsApp: ${tel}\nDirección de envío: ${direccionCliente}`;

        // Registro de lead best-effort por cada producto del carrito — igual
        // que el flujo directo, no debe bloquear el envío si falla.
        _carrito.forEach(it => {
            const prod = _prods.find(p => p.c === it.codigo);
            if(prod) registrarLead(prod, tel, nombreCliente, direccionCliente);
        });

        _carrito = [];
        guardarCarrito();
        renderCarritoFab();
        cerrarCarrito();
        window.open(`https://wa.me/${_waNum}?text=${encodeURIComponent(msg)}`,"_blank");
    }

    // Verifica el stock real contra el catálogo (que es una foto fija tomada al
    // generar el link) y marca "AGOTADO" lo que ya se vendió por otro canal
    // (consignación, ecommerce u otro afiliado) desde entonces.
    async function actualizarDisponibilidad(){
        try{
            const res = await fetch(API_URL, {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ accion:"GET_STOCK" })
            });
            const data = await res.json();
            const stock = data.stock || [];
            const mapa = new Map(stock.map(s => [s.codigo, s]));

            _prods.forEach((p,i) => {
                if(!p.c) return;
                const s = mapa.get(p.c);
                const card = document.querySelector(`.card[data-idx="${i}"]`);

                // Refrescar la foto si cambió en Stock desde que se generó el link —
                // así no hace falta regenerar el catálogo solo por una foto nueva.
                if(s?.foto && s.foto !== p.i){
                    p.i = s.foto;
                    const img = card?.querySelector(".card-img");
                    if(img) img.src = s.foto;
                }

                // Refrescar el precio si cambió en Stock — así un ajuste de precio
                // aplica solo, sin tener que regenerar el link.
                let precioCambio = false;
                if(!p.par && s && s.precio != null && parseFloat(s.precio) !== parseFloat(p.p)){
                    p.p = parseFloat(s.precio).toFixed(2);
                    precioCambio = true;
                } else if(p.par && (p.cD?.length || p.cC?.length)){
                    // Pares/tríos: el catálogo guarda el código de CADA pieza del set,
                    // así que se suma el precio actual de cada una para recalcular el total.
                    const sumar = codigos => (codigos||[]).reduce((sum, cod) => {
                        const row = mapa.get(cod);
                        return sum + (row ? parseFloat(row.precio || 0) : 0);
                    }, 0);
                    if(p.cD?.length){
                        const nuevoD = sumar(p.cD).toFixed(2);
                        if(nuevoD !== parseFloat(p.pD||0).toFixed(2)){ p.pD = nuevoD; precioCambio = true; }
                    }
                    if(p.cC?.length){
                        const nuevoC = sumar(p.cC).toFixed(2);
                        if(nuevoC !== parseFloat(p.pH||0).toFixed(2)){ p.pH = nuevoC; precioCambio = true; }
                    }
                }
                if(precioCambio){
                    const priceEl = document.getElementById(`price-${i}`);
                    if(priceEl) priceEl.innerHTML = renderPrecioHtml(p);
                }

                // Si el código ya no existe en stock (eliminado) o quedó sin
                // unidades disponibles o fue reservado, se marca agotado.
                //
                // NO usar stock_total: ese campo NO se mantiene — no se decrementa
                // al vender, así que la condición <= 0 no se cumplía nunca y no se
                // ocultaba nada (al revisar, 0 de 991 productos lo tenían en 0,
                // mientras 13 estaban realmente sin unidades). Se usa la misma
                // fórmula que el admin en _stockTotalProd(): las unidades reales
                // repartidas entre bodega, tienda y consignación.
                const sinUnidades = row => !row || row.reservado ||
                    ((parseInt(row.stock_bodega)||0)
                   + (parseInt(row.stock_tienda)||0)
                   + (parseInt(row.stock_consignacion)||0)) <= 0;

                // Pares y tríos: el set solo se puede armar si TODAS sus piezas
                // tienen unidades. Antes se miraba solo el código principal, así
                // que el par seguía ofreciéndose aunque la otra pieza ya se
                // hubiera vendido por consignación, otro afiliado o la tienda —
                // y el cliente terminaba pidiendo algo imposible de completar.
                // Los códigos de cada pieza ya vienen en el catálogo (cD/cC), que
                // es lo mismo que se usa arriba para recalcular el precio del set.
                const piezas = (p.par ? [...(p.cD||[]), ...(p.cC||[])] : []).filter(Boolean);

                const agotado = piezas.length
                    ? piezas.some(cod => sinUnidades(mapa.get(cod)))
                    : sinUnidades(s);
                if(!agotado) return;
                p._agotado = true;
                // Ocultar en vez de tachar — más limpio para el cliente, y evita
                // que quede un producto "muerto" ocupando espacio en la lista.
                if(card) card.style.display = "none";
            });
        } catch(_){ /* si falla la verificación, se deja el catálogo como estaba */ }
    }

    function abrirFotoZoom(url){
        document.getElementById("foto-zoom-img").src = url;
        document.getElementById("foto-zoom-overlay").style.display = "flex";
    }
    function cerrarFotoZoom(){
        document.getElementById("foto-zoom-overlay").style.display = "none";
    }

    window.elegirTalla     = elegirTalla;
    window.selSz           = selSz;
    window.confirmarTalla  = confirmarTalla;
    window.cerrarTallas    = cerrarTallas;
    window.actualizarBotonSz = actualizarBotonSz;
    window.abrirFotoZoom  = abrirFotoZoom;
    window.cerrarFotoZoom = cerrarFotoZoom;
    window.abrirCarrito   = abrirCarrito;
    window.cerrarCarrito  = cerrarCarrito;
    window.cambiarQtyCarrito     = cambiarQtyCarrito;
    window.actualizarBotonCarrito = actualizarBotonCarrito;
    window.enviarCarritoWhatsApp  = enviarCarritoWhatsApp;
    window.toggleFiltroTalla = toggleFiltroTalla;
    window.limpiarFiltroTalla = limpiarFiltroTalla;
    window._abrirRegaloPromo = _abrirRegaloPromo;

    /* ── Arranque ── */

    let data;
    // KV route: data injected server-side
    if(window.__CATALOG_DATA__){
        data = window.__CATALOG_DATA__;
    } else {
        if(!c){
            document.getElementById("app").innerHTML='<div style="text-align:center;padding:60px;color:#888;">Link inválido.</div>';
            return;
        }
        try{
            // Try LZ-string URL-safe (new), then base64 LZ-string, then plain base64 (legacy)
            const lzUri = LZString.decompressFromEncodedURIComponent(c);
            if(lzUri){ data=JSON.parse(lzUri); }
            else {
                const raw=decodeURIComponent(c);
                const lzB64=LZString.decompressFromBase64(raw);
                data=lzB64 ? JSON.parse(lzB64) : JSON.parse(decodeURIComponent(escape(atob(raw))));
            }
        } catch(e){
            document.getElementById("app").innerHTML='<div style="text-align:center;padding:60px;color:#888;">Link inválido o corrupto.</div>';
            return;
        }
    }
    if(data.expiry && Date.now()>data.expiry) showExpired(data.nombre, data.wa);
    else { render(data); actualizarDisponibilidad(); renderCarritoFab(); }
})();
</script>
